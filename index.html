<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMASI STOCK PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { animation: pulse 1.5s infinite; border: 2px solid #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        label { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-left: 0.25rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 font-sans text-slate-900">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-900 italic tracking-tighter">EMASI STOCK</h1>
            <button onclick="logout()" id="btn-logout" class="hidden text-xs bg-white px-3 py-1 rounded-full shadow-sm text-slate-400 font-bold border">DÉCONNEXION</button>
        </div>

        <div id="login-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl border mt-10">
            <h2 class="text-center font-black text-slate-400 mb-6 uppercase tracking-widest text-sm">Accès Sécurisé</h2>
            <div class="space-y-4">
                <div>
                    <label>Votre Identifiant</label>
                    <input id="pseudo" type="text" placeholder="Ex: Thierry" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label>Code Secret</label>
                    <input id="password" type="password" placeholder="••••" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl shadow-lg hover:bg-blue-700 transition uppercase tracking-widest mt-4">Lancer la session</button>
            </div>
        </div>

        <div id="main-app" class="hidden space-y-4">
            
            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                <button onclick="showTab('stock')" class="flex flex-col items-center p-2 tab-btn active text-blue-600 transition-all"><span class="text-2xl">📦</span><span class="text-[10px] font-black mt-1">STOCK</span></button>
                <button onclick="showTab('achats')" class="flex flex-col items-center p-2 tab-btn text-slate-300 transition-all"><span class="text-2xl">🛒</span><span class="text-[10px] font-black mt-1">ACHATS</span></button>
                <button onclick="showTab('logs')" class="flex flex-col items-center p-2 tab-btn text-slate-300 transition-all"><span class="text-2xl">📜</span><span class="text-[10px] font-black mt-1">LOGS</span></button>
            </nav>

            <div id="tab-stock" class="tabs-content active space-y-4">
                <div class="relative">
                    <input id="search" oninput="chargerProduits()" type="text" placeholder="Rechercher un article..." class="w-full border p-5 rounded-[1.5rem] shadow-sm outline-none sticky top-2 z-10 bg-white focus:ring-2 focus:ring-blue-400 transition-all pl-12">
                    <span class="absolute left-5 top-5 opacity-30">🔍</span>
                </div>

                <button id="toggle-form" onclick="toggleForm()" class="w-full bg-blue-50 text-blue-700 p-5 rounded-[1.5rem] font-black text-sm uppercase italic tracking-wider border border-blue-100">+ Nouvel Article / Modifier</button>
                
                <div id="form-container" class="hidden bg-white p-6 rounded-[2rem] border shadow-2xl space-y-4 relative">
                    <input id="edit-id" type="hidden">
                    
                    <div>
                        <label>Désignation de l'article</label>
                        <input id="nom" type="text" placeholder="Nom précis" class="w-full border p-3 rounded-xl bg-slate-50 outline-none focus:border-blue-400">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label>Emplacement / Lieu</label>
                            <input id="emplacement" type="text" placeholder="Ex: Rayon A" class="w-full border p-3 rounded-xl bg-slate-50 outline-none">
                        </div>
                        <div>
                            <label>Quantité actuelle</label>
                            <input id="qty" type="number" placeholder="0" class="w-full border p-3 rounded-xl bg-slate-50 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label>Prix d'achat (€)</label>
                            <input id="prix" type="number" step="0.01" placeholder="0.00" class="w-full border p-3 rounded-xl bg-slate-50 outline-none">
                        </div>
                        <div>
                            <label>Seuil d'alerte</label>
                            <input id="seuil" type="number" placeholder="Mini" class="w-full border p-3 rounded-xl bg-slate-50 outline-none">
                        </div>
                    </div>

                    <div>
                        <label>Photo du produit</label>
                        <label class="flex flex-col items-center justify-center w-full bg-blue-50 border-2 border-dashed border-blue-200 p-8 rounded-2xl text-center cursor-pointer hover:bg-blue-100 transition mt-1">
                            <span class="text-3xl">📸</span>
                            <span class="text-[10px] font-black text-blue-600 uppercase mt-2">Cliquez pour Ouvrir la Caméra</span>
                            <input id="photo-file" type="file" accept="image/*" class="hidden">
                        </label>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button onclick="ajouterOuModifier()" class="flex-1 bg-blue-600 text-white p-5 rounded-2xl font-black shadow-lg uppercase text-sm tracking-widest">Enregistrer</button>
                        <button onclick="toggleForm()" class="bg-slate-100 text-slate-500 px-6 rounded-2xl font-bold text-xs uppercase">Annuler</button>
                    </div>
                </div>

                <div id="liste-produits" class="grid gap-4 pb-4"></div>
            </div>

            <div id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                    <p class="text-[10px] uppercase font-black opacity-60 tracking-[0.2em]">Budget Réapprovisionnement</p>
                    <h2 id="total-budget" class="text-4xl font-black mt-1">0.00 €</h2>
                    <button onclick="envoyerRapportMail()" class="mt-6 w-full bg-white text-blue-700 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md active:scale-95 transition">📧 Envoyer le rapport à Thierry</button>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </div>

            <div id="tab-logs" class="tabs-content">
                <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-[0.3em] mb-4 ml-2">Mouvements Récents</h3>
                <div id="liste-logs" class="bg-white rounded-[1.5rem] border shadow-sm divide-y overflow-hidden text-sm"></div>
            </div>
        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";

        async function login() {
            const pseudo = document.getElementById('pseudo').value;
            const password = document.getElementById('password').value;
            const { data, error } = await sb.auth.signInWithPassword({ email: pseudo.toLowerCase() + "@emasi.stock", password });
            if (error) alert("Identifiant ou Code incorrect");
            else checkUser();
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                chargerProduits();
                chargerLogs();
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-300'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.replace('text-slate-300', 'text-blue-600');
            if(tab === 'achats') calculerAchats();
        }

        function toggleForm() {
            const form = document.getElementById('form-container');
            form.classList.toggle('hidden');
            if(form.classList.contains('hidden')) resetForm();
        }

        async function chargerProduits() {
            const search = document.getElementById('search').value.toLowerCase();
            let { data } = await sb.from('produits').select('*').order('nom');
            if(search) data = data.filter(p => p.nom.toLowerCase().includes(search));

            const liste = document.getElementById('liste-produits');
            liste.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-[1.5rem] shadow-sm flex items-center gap-4 border border-slate-100 ${p.quantite <= p.seuil_critique ? 'low-stock' : ''}">
                    <img src="${p.image_url || 'https://via.placeholder.com/100?text=EMASI'}" class="w-20 h-20 rounded-2xl object-cover
