<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMASI STOCK PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { animation: pulse 1.5s infinite; border: 2px solid #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-900 italic">EMASI STOCK</h1>
            <button onclick="logout()" id="btn-logout" class="hidden text-xs bg-white px-3 py-1 rounded-full shadow-sm text-slate-400">Déconnexion</button>
        </div>

        <div id="login-section" class="bg-white p-8 rounded-3xl shadow-xl border mt-10">
            <input id="pseudo" type="text" placeholder="Identifiant" class="w-full border p-4 mb-3 rounded-2xl bg-slate-50 outline-none">
            <input id="password" type="password" placeholder="Code secret" class="w-full border p-4 mb-6 rounded-2xl bg-slate-50 outline-none">
            <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-4 rounded-2xl shadow-lg hover:bg-blue-700 transition uppercase tracking-widest">Entrer</button>
        </div>

        <div id="main-app" class="hidden space-y-4">
            
            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 z-50 shadow-2xl">
                <button onclick="showTab('stock')" class="flex flex-col items-center p-2 tab-btn active text-blue-600"><span class="text-xl">📦</span><span class="text-[10px] font-bold">STOCK</span></button>
                <button onclick="showTab('achats')" class="flex flex-col items-center p-2 tab-btn text-slate-400"><span class="text-xl">🛒</span><span class="text-[10px] font-bold">ACHATS</span></button>
                <button onclick="showTab('logs')" class="flex flex-col items-center p-2 tab-btn text-slate-400"><span class="text-xl">📜</span><span class="text-[10px] font-bold">LOGS</span></button>
            </nav>

            <div id="tab-stock" class="tabs-content active space-y-4">
                <input id="search" oninput="chargerProduits()" type="text" placeholder="Rechercher un article..." class="w-full border p-4 rounded-2xl shadow-sm outline-none sticky top-2 z-10 bg-white">

                <button id="toggle-form" onclick="toggleForm()" class="w-full bg-blue-100 text-blue-700 p-4 rounded-2xl font-black text-sm uppercase italic">+ Nouvel Article / Modifier</button>
                
                <div id="form-container" class="hidden bg-white p-5 rounded-3xl border shadow-md space-y-4">
                    <input id="edit-id" type="hidden">
                    <input id="nom" type="text" placeholder="Nom de l'article" class="w-full border p-3 rounded-xl bg-slate-50">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="emplacement" type="text" placeholder="Lieu" class="border p-3 rounded-xl bg-slate-50">
                        <input id="qty" type="number" placeholder="Quantité" class="border p-3 rounded-xl bg-slate-50">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="prix" type="number" step="0.01" placeholder="Prix d'achat €" class="border p-3 rounded-xl bg-slate-50">
                        <input id="seuil" type="number" placeholder="Seuil Alerte" class="border p-3 rounded-xl bg-slate-50">
                    </div>
                    <label class="block w-full bg-slate-100 border-2 border-dashed border-slate-300 p-6 rounded-2xl text-center cursor-pointer hover:bg-slate-200 transition">
                        <span class="text-2xl">📸</span><br>
                        <span class="text-xs font-bold text-slate-500 uppercase">Prendre / Choisir Photo</span>
                        <input id="photo-file" type="file" accept="image/*" class="hidden">
                    </label>
                    <div class="flex gap-2">
                        <button onclick="ajouterOuModifier()" class="flex-1 bg-blue-600 text-white p-4 rounded-2xl font-black shadow-lg">ENREGISTRER</button>
                        <button onclick="toggleForm()" class="bg-slate-100 text-slate-500 px-4 rounded-2xl">Annuler</button>
                    </div>
                </div>

                <div id="liste-produits" class="grid gap-4"></div>
            </div>

            <div id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-blue-600 p-6 rounded-3xl text-white shadow-lg">
                    <p class="text-xs uppercase font-bold opacity-80">Budget Estimé</p>
                    <h2 id="total-budget" class="text-4xl font-black">0.00 €</h2>
                    <button onclick="envoyerRapportMail()" class="mt-4 w-full bg-white text-blue-600 py-2 rounded-xl text-xs font-black uppercase">📧 Envoyer rapport à Thierry</button>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </div>

            <div id="tab-logs" class="tabs-content">
                <div id="liste-logs" class="bg-white rounded-3xl border shadow-sm divide-y overflow-hidden text-sm"></div>
            </div>
        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; // TA CLÉ
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";

        // --- AUTH ---
        async function login() {
            const pseudo = document.getElementById('pseudo').value;
            const password = document.getElementById('password').value;
            const { data, error } = await sb.auth.signInWithPassword({ email: pseudo.toLowerCase() + "@emasi.stock", password });
            if (error) alert("Accès refusé");
            else checkUser();
        }
        async function logout() { await sb.auth.signOut(); location.reload(); }
        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                chargerProduits();
                chargerLogs();
            }
        }

        // --- NAVIGATION ---
        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-400'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.replace('text-slate-400', 'text-blue-600');
            if(tab === 'achats') calculerAchats();
        }

        function toggleForm() {
            const form = document.getElementById('form-container');
            form.classList.toggle('hidden');
            if(form.classList.contains('hidden')) resetForm();
        }

        // --- STOCK ---
        async function chargerProduits() {
            const search = document.getElementById('search').value.toLowerCase();
            let { data } = await sb.from('produits').select('*').order('nom');
            if(search) data = data.filter(p => p.nom.toLowerCase().includes(search));

            const liste = document.getElementById('liste-produits');
            liste.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-3xl shadow-sm flex items-center gap-4 border border-transparent ${p.quantite <= p.seuil_critique ? 'low-stock' : ''}">
                    <img src="${p.image_url || 'https://via.placeholder.com/100?text=EMASI'}" class="w-20 h-20 rounded-2xl object-cover bg-slate-50 shadow-inner">
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h3 class="font-black text-slate-800">${p.nom}</h3>
                            <button onclick="preparerEdition('${p.id}')" class="text-blue-500 text-sm">✏️ Éditer</button>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">📍 ${p.emplacement || '-'}</p>
                        <div class="flex items-center justify-between mt-3">
                            <div class="flex gap-2">
                                <button onclick="updateQty('${p.id}', ${p.quantite - 1}, '${p.nom}')" class="bg-slate-100 w-10 h-10 rounded-xl font-black">-</button>
                                <button onclick="updateQty('${p.id}', ${p.quantite + 1}, '${p.nom}')" class="bg-slate-100 w-10 h-10 rounded-xl font-black">+</button>
                            </div>
                            <span class="text-xl font-black ${p.quantite <= p.seuil_critique ? 'text-red-600' : 'text-slate-800'}">x${p.quantite}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateQty(id, newQty, nom) {
            if(newQty < 0) return;
            await sb.from('produits').update({ quantite: newQty }).eq('id', id);
            await sb.from('historique').insert([{ produit_nom: nom, utilisateur: userPseudo, action: 'MODIF', quantite_modifiee: newQty }]);
            chargerProduits();
        }

        // --- AJOUT ET MODIFICATION ---
        async function preparerEdition(id) {
            const { data } = await sb.from('produits').select('*').eq('id', id).single();
            document.getElementById('edit-id').value = data.id;
            document.getElementById('nom').value = data.nom;
            document.getElementById('emplacement').value = data.emplacement;
            document.getElementById('qty').value = data.quantite;
            document.getElementById('prix').value = data.prix_unitaire;
            document.getElementById('seuil').value = data.seuil_critique;
            toggleForm();
            window.scrollTo(0, 0);
        }

        async function ajouterOuModifier() {
            const id = document.getElementById('edit-id').value;
            const obj = {
                nom: document.getElementById('nom').value,
                emplacement: document.getElementById('emplacement').value,
                quantite: parseInt(document.getElementById('qty').value),
                prix_unitaire: parseFloat(document.getElementById('prix').value) || 0,
                seuil_critique: parseInt(document.getElementById('seuil').value) || 0
            };

            const photoFile = document.getElementById('photo-file').files[0];
            if (photoFile) {
                const fileName = `${Date.now()}_${photoFile.name}`;
                await sb.storage.from('photos-stock').upload(fileName, photoFile);
                const { data: urlData } = sb.storage.from('photos-stock').getPublicUrl(fileName);
                obj.image_url = urlData.publicUrl;
            }

            if(id) {
                await sb.from('produits').update(obj).eq('id', id);
                alert("Article mis à jour !");
            } else {
                await sb.from('produits').insert([obj]);
                alert("Nouvel article créé !");
            }
            toggleForm();
            chargerProduits();
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('nom').value = "";
            document.getElementById('emplacement').value = "";
            document.getElementById('qty').value = "";
            document.getElementById('prix').value = "";
            document.getElementById('seuil').value = "";
        }

        // --- ACHATS ---
        async function calculerAchats() {
            const { data } = await sb.from('produits').select('*');
            const alertes = data.filter(p => p.quantite <= p.seuil_critique);
            let total = 0;
            const liste = document.getElementById('liste-achats');
            
            liste.innerHTML = alertes.map(p => {
                const aCommander = (p.seuil_critique + 5) - p.quantite;
                const cout = aCommander * p.prix_unitaire;
                total += cout;
                return `
                    <div class="bg-white p-4 rounded-2xl border-l-8 border-red-500 shadow-sm">
                        <div class="flex justify-between font-black">
                            <span>${p.nom}</span>
                            <span class="text-red-600">Commander: +${aCommander}</span>
                        </div>
                        <p class="text-xs text-slate-400 font-bold mt-1">Est. budget : ${cout.toFixed(2)} € (Stock actuel: ${p.quantite})</p>
                    </div>
                `;
            }).join('');
            document.getElementById('total-budget').innerText = total.toFixed(2) + " €";
        }

        function envoyerRapportMail() {
            const budget = document.getElementById('total-budget').innerText;
            const mailto = "mailto:thierry.p057@gmail.com?subject=Rapport Stock EMASI&body=Le budget estimé pour le réapprovisionnement est de " + budget + ". Voir l'application pour la liste détaillée.";
            window.location.href = mailto;
        }

        async function chargerLogs() {
            const { data } = await sb.from('historique').select('*').order('date_action', { ascending: false }).limit(20);
            document.getElementById('liste-logs').innerHTML = data.map(l => `
                <div class="p-3 flex justify-between">
                    <div><span class="font-bold text-blue-600">${l.utilisateur}</span> : ${l.produit_nom}</div>
                    <div class="text-[10px] text-slate-400">${new Date(l.date_action).toLocaleTimeString()}</div>
                </div>
            `).join('');
        }

        checkUser();
    </script>
</body>
</html>
