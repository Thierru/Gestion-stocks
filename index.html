<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI - V1.4 GLOBAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .tabs-content { display: none; }
        .tabs-content.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .low-stock { border: 2px solid #ef4444 !important; background: #fef2f2; }
        label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 4px; }
    </style>
</head>
<body class="min-h-screen pb-32">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <header id="app-header" class="hidden flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-blue-900 leading-none">RTE <span class="text-blue-500">EMASI</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Gestion Stock & Matériel</p>
            </div>
            <button onclick="logout()" class="glass text-[10px] px-4 py-2 rounded-full font-black border border-slate-200 uppercase">Quitter</button>
        </header>

        <div id="login-section" class="bg-white p-8 rounded-[3rem] shadow-2xl mt-10">
            <h2 class="font-black text-center text-slate-800 uppercase mb-8 tracking-widest">Accès Privé</h2>
            <div class="space-y-4">
                <input id="pseudo" type="email" placeholder="E-mail (ex: thierry@emasi.stock)" class="w-full bg-slate-100 p-5 rounded-2xl outline-none font-bold">
                <input id="password" type="password" placeholder="Mot de passe" class="w-full bg-slate-100 p-5 rounded-2xl outline-none font-bold">
                <button onclick="login()" id="btn-login-action" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl uppercase shadow-lg active:scale-95 transition-transform">Entrer</button>
            </div>
        </div>

        <main id="main-app" class="hidden space-y-4">
            
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg glass border border-white rounded-[2.5rem] flex justify-around p-3 z-50 shadow-2xl">
                <button onclick="showTab('pieces')" class="tab-btn active text-blue-600 flex flex-col items-center"><span class="text-xl">📦</span><span class="text-[9px] font-black uppercase mt-1">Pièces</span></button>
                <button onclick="showTab('materiel')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">🛠️</span><span class="text-[9px] font-black uppercase mt-1">Matériel</span></button>
                <button onclick="showTab('achats')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">🛒</span><span class="text-[9px] font-black uppercase mt-1">Budget</span></button>
                <button onclick="showTab('admin')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">⚙️</span><span class="text-[9px] font-black uppercase mt-1">Outils</span></button>
            </nav>

            <div id="scanner-container" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col p-6 items-center justify-center">
                <div id="reader" class="w-full rounded-3xl overflow-hidden"></div>
                <button onclick="toggleScanner()" class="mt-10 bg-white/10 text-white px-8 py-4 rounded-full font-black uppercase text-xs">Annuler</button>
            </div>

            <section id="tab-pieces" class="tabs-content active space-y-4">
                <div class="flex gap-2">
                    <input id="search" oninput="chargerDonnees()" type="text" placeholder="Chercher une pièce..." class="flex-1 glass p-5 rounded-3xl shadow-sm outline-none font-bold">
                    <button onclick="toggleScanner()" class="bg-blue-600 text-white w-16 rounded-3xl shadow-lg flex items-center justify-center text-xl">📷</button>
                </div>
                <button onclick="ouvrirForm('PIECE')" class="w-full bg-white text-blue-600 p-4 rounded-3xl font-black text-[10px] uppercase shadow-sm border border-blue-50">+ Ajouter une pièce</button>
                <div id="liste-pieces" class="grid gap-3"></div>
            </section>

            <section id="tab-materiel" class="tabs-content space-y-4">
                <div class="flex gap-2">
                    <input id="search-mat" oninput="chargerDonnees()" type="text" placeholder="Chercher matériel..." class="flex-1 glass p-5 rounded-3xl shadow-sm outline-none font-bold">
                    <button onclick="toggleScanner()" class="bg-slate-800 text-white w-16 rounded-3xl shadow-lg flex items-center justify-center text-xl">📷</button>
                </div>
                <button onclick="ouvrirForm('MATERIEL')" class="w-full bg-slate-800 text-white p-4 rounded-3xl font-black text-[10px] uppercase shadow-lg">+ Ajouter un appareil</button>
                <div id="liste-materiel" class="grid gap-3"></div>
            </section>

            <section id="tab-achats" class="tabs-content space-y-4 text-center">
                <div class="bg-blue-900 p-10 rounded-[3rem] text-white shadow-2xl">
                    <p class="text-[10px] uppercase font-black opacity-50 tracking-widest">Estimation Achats</p>
                    <h2 id="total-budget" class="text-4xl font-black mt-2">0.00 €</h2>
                </div>
                <div id="liste-achats" class="grid gap-2 text-left"></div>
            </section>

            <section id="tab-admin" class="tabs-content space-y-6 bg-white p-8 rounded-[3rem] shadow-sm">
                <h3 class="font-black uppercase text-slate-800 border-b pb-4 tracking-widest text-sm">Gestion des données</h3>
                
                <div class="space-y-6">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-3">Sauvegarder</p>
                        <button onclick="exporterExcel()" class="w-full bg-emerald-600 text-white p-5 rounded-2xl font-black uppercase text-xs shadow-lg active:scale-95 transition-transform">📊 Exporter vers Excel (CSV)</button>
                    </div>
                    
                    <div class="pt-6 border-t border-slate-100">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-3">Restaurer / Importer</p>
                        <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200">
                            <input type="file" id="csv-import" accept=".csv" class="text-[10px] mb-4 block w-full">
                            <button onclick="importerExcel()" class="w-full bg-blue-100 text-blue-700 p-4 rounded-xl font-black uppercase text-[10px] active:scale-95 transition-transform">🚀 Lancer l'importation</button>
                        </div>
                    </div>
                </div>
            </section>

            <div id="form-container" class="hidden fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
                <div class="max-w-xl mx-auto space-y-5 pb-28">
                    <div class="flex justify-between items-center">
                        <h2 id="form-title" class="text-xl font-black text-blue-900 uppercase italic">Fiche Article</h2>
                        <button onclick="toggleForm()" class="bg-slate-100 w-10 h-10 rounded-full font-bold">✕</button>
                    </div>

                    <div class="bg-slate-50 p-6 rounded-[2.5rem] flex flex-col items-center gap-4 border-2 border-dashed border-slate-200">
                        <div id="photo-preview" class="w-40 h-40 rounded-[2rem] bg-white shadow-inner overflow-hidden flex items-center justify-center border-4 border-white">
                            <span class="text-[10px] text-slate-300 font-black uppercase">Pas d'image</span>
                        </div>
                        <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden" onchange="traiterEtUploaderPhoto(this)">
                        <button onclick="document.getElementById('photo-input').click()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-black text-[10px] uppercase">Prendre photo</button>
                        <input type="hidden" id="photo-url">
                    </div>

                    <input id="edit-id" type="hidden"><input id="edit-type" type="hidden">
                    <div class="space-y-4">
                        <div><label>Désignation</label><input id="nom" type="text" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold"></div>
                        <div><label>ID Code (Scan)</label><input id="barcode" type="text" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-mono text-blue-600"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label>Zone</label><select id="zone-1" class="w-full bg-slate-100 p-4 rounded-2xl font-bold"><option value="LABO">LABO</option><option value="ATELIER">ATELIER</option><option value="BUREAU">BUREAU</option></select></div>
                            <div><label>Précision</label><input id="zone-2" type="text" class="w-full bg-slate-100 p-4 rounded-2xl"></div>
                        </div>
                        <div id="fields-piece" class="grid grid-cols-2 gap-3">
                            <div><label>Stock</label><input id="qty" type="number" class="w-full bg-slate-100 p-4 rounded-2xl font-black"></div>
                            <div><label>Seuil</label><input id="seuil" type="number" class="w-full bg-slate-100 p-4 rounded-2xl font-black"></div>
                        </div>
                        <div id="fields-materiel" class="hidden">
                            <label>État</label>
                            <select id="etat-materiel" class="w-full bg-slate-100 p-4 rounded-2xl font-black"><option value="OK">✅ OPÉRATIONNEL</option><option value="HS">❌ HS</option><option value="CO">⏳ ÉTALONNAGE</option></select>
                        </div>
                        <div><label>Prix estimé HT (€)</label><input id="prix" type="number" step="0.01" class="w-full bg-slate-100 p-4 rounded-2xl font-bold"></div>
                    </div>
                    <button onclick="sauvegarder()" id="btn-save" class="w-full bg-blue-600 text-white p-6 rounded-3xl font-black uppercase shadow-xl tracking-widest active:scale-95 transition-transform">Enregistrer</button>
                    <button id="btn-delete" onclick="supprimerArticle()" class="w-full text-red-500 font-bold text-[10px] uppercase pt-4 hidden">Supprimer l'article</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";
        let html5QrCode;

        function notifier(msg, success = true) {
            const t = document.createElement('div');
            t.className = `fixed top-6 left-1/2 -translate-x-1/2 px-8 py-4 rounded-full text-[10px] font-black z-[300] shadow-2xl transition-all border glass ${success ? 'text-emerald-600 border-emerald-100' : 'text-blue-600 border-blue-100'}`;
            t.innerHTML = msg.toUpperCase(); document.body.appendChild(t);
            setTimeout(() => { t.classList.add('opacity-0'); setTimeout(() => t.remove(), 500); }, 2500);
        }

        async function login() {
            const btn = document.getElementById('btn-login-action');
            const email = document.getElementById('pseudo').value.trim();
            const pass = document.getElementById('password').value;
            btn.innerText = "CONNEXION...";
            const { error } = await sb.auth.signInWithPassword({ email: email.includes('@') ? email : email + "@emasi.stock", password: pass });
            if (error) { alert(error.message); btn.innerText = "ENTRER"; } else checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                chargerDonnees();
            }
        }

        async function chargerDonnees() {
            const { data } = await sb.from('produits').select('*').order('nom');
            renderListes(data || []);
            calculerBudget(data || []);
        }

        function renderListes(data) {
            const s1 = document.getElementById('search').value.toLowerCase();
            const s2 = document.getElementById('search-mat').value.toLowerCase();
            const pieces = data.filter(p => (!p.categorie || p.categorie === 'PIECE') && p.nom.toLowerCase().includes(s1));
            const materiel = data.filter(p => p.categorie === 'MATERIEL' && p.nom.toLowerCase().includes(s2));

            document.getElementById('liste-pieces').innerHTML = pieces.map(p => `
                <div class="bg-white p-4 rounded-[2rem] shadow-sm flex gap-4 items-center border border-white ${p.quantite <= (p.seuil_critique||0) ? 'low-stock' : ''}">
                    <div class="w-14 h-14 rounded-2xl bg-slate-50 overflow-hidden flex-shrink-0 border flex items-center justify-center">
                        ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : `📦`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-black text-slate-800 text-[11px] uppercase truncate">${p.nom}</h3>
                        <p class="text-[8px] text-blue-500 font-bold font-mono uppercase mt-1">ID: ${p.barcode || '---'}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateStock('${p.id}', 1, '${p.nom}')" class="bg-slate-100 w-8 h-8 rounded-xl font-black text-blue-600">+</button>
                        <span class="text-xl font-black min-w-[25px] text-center">${p.quantite || 0}</span>
                        <button onclick="ouvrirForm('PIECE', '${p.id}')" class="p-2 text-xl">⚙️</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('liste-materiel').innerHTML = materiel.map(p => `
                <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-white flex gap-4 items-center ${p.etat === 'HS' ? 'border-red-500 bg-red-50' : ''}">
                    <div class="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center border">${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : `🛠️`}</div>
                    <div class="flex-1"><h3 class="font-black text-slate-800 text-[11px] uppercase truncate">${p.nom}</h3><span class="text-[7px] font-black uppercase ${p.etat === 'OK' ? 'text-emerald-600' : 'text-red-600'}">${p.etat || 'OK'}</span></div>
                    <button onclick="ouvrirForm('MATERIEL', '${p.id}')" class="p-2 text-xl">⚙️</button>
                </div>
            `).join('');
        }

        // --- FONCTIONS EXCEL ---
        async function exporterExcel() {
            const { data } = await sb.from('produits').select('*');
            if(!data) return;
            const headers = ["nom", "barcode", "emplacement", "quantite", "seuil_critique", "prix_unitaire", "categorie", "etat"];
            const csv = [headers.join(","), ...data.map(r => headers.map(h => `"${r[h]||''}"`).join(","))].join("\n");
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `STOCK_EMASI_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        async function importerExcel() {
            const file = document.getElementById('csv-import').files[0];
            if(!file) return alert("Sélectionnez un fichier .csv");
            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split("\n").slice(1);
                const items = rows.map(row => {
                    const c = row.split(",").map(x => x.replace(/"/g, ''));
                    if(c.length < 2) return null;
                    return { nom: c[0], barcode: c[1], emplacement: c[2], quantite: parseInt(c[3])||0, seuil_critique: parseInt(c[4])||0, prix_unitaire: parseFloat(c[5])||0, categorie: c[6]||'PIECE', etat: c[7]||'OK' };
                }).filter(x => x !== null);
                const { error } = await sb.from('produits').upsert(items, { onConflict: 'barcode' });
                if(error) alert(error.message); else { alert("Import réussi !"); chargerDonnees(); }
            };
            reader.readAsText(file);
        }

        async function sauvegarder() {
            const id = document.getElementById('edit-id').value;
            const type = document.getElementById('edit-type').value;
            const payload = {
                nom: document.getElementById('nom').value.trim(),
                barcode: document.getElementById('barcode').value.trim(),
                emplacement: `${document.getElementById('zone-1').value} - ${document.getElementById('zone-2').value}`,
                prix_unitaire: parseFloat(document.getElementById('prix').value) || 0,
                image_url: document.getElementById('photo-url').value,
                categorie: type,
                quantite: type === 'PIECE' ? (parseInt(document.getElementById('qty').value) || 0) : 1,
                seuil_critique: type === 'PIECE' ? (parseInt(document.getElementById('seuil').value) || 0) : 0,
                etat: type === 'MATERIEL' ? document.getElementById('etat-materiel').value : 'OK'
            };
            try {
                let res = id ? await sb.from('produits').update(payload).eq('id', id) : await sb.from('produits').insert([payload]);
                if(res.error) throw res.error;
                toggleForm(); chargerDonnees(); notifier("Enregistré");
            } catch(e) { alert("Erreur : " + e.message); }
        }

        async function updateStock(id, diff, nom) {
            const { data } = await sb.from('produits').select('quantite').eq('id', id).single();
            const n = (data.quantite || 0) + diff; if(n < 0) return;
            await sb.from('produits').update({ quantite: n }).eq('id', id);
            chargerDonnees();
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-400'));
            event.currentTarget.classList.replace('text-slate-400', 'text-blue-600');
        }

        function toggleForm() { document.getElementById('form-container').classList.toggle('hidden'); }
        function ouvrirForm(type, id = null) {
            document.querySelectorAll('#form-container input').forEach(i => i.value = "");
            document.getElementById('edit-type').value = type;
            document.getElementById('fields-piece').style.display = type === 'PIECE' ? 'grid' : 'none';
            document.getElementById('fields-materiel').style.display = type === 'MATERIEL' ? 'block' : 'none';
            if(id) chargerFiche(id);
            toggleForm();
        }

        async function chargerFiche(id) {
            const { data } = await sb.from('produits').select('*').eq('id', id).single();
            document.getElementById('edit-id').value = data.id;
            document.getElementById('nom').value = data.nom;
            document.getElementById('barcode').value = data.barcode || "";
            document.getElementById('qty').value = data.quantite;
            document.getElementById('seuil').value = data.seuil_critique;
            document.getElementById('prix').value = data.prix_unitaire;
            document.getElementById('photo-url').value = data.image_url || "";
            if(data.image_url) document.getElementById('photo-preview').innerHTML = `<img src="${data.image_url}" class="w-full h-full object-cover">`;
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }
        checkUser();
    </script>
</body>
</html>
