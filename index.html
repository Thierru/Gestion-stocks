<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMASI - Gestion de Stock</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { background-color: #fff; } 50% { background-color: #fee2e2; } 100% { background-color: #fff; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">
    <div id="app" class="max-w-2xl mx-auto p-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black text-blue-900 italic">EMASI STOCK <span class="text-xs bg-blue-600 text-white px-2 py-1 rounded not-italic">V2.0</span></h1>
            <button onclick="logout()" id="btn-logout" class="hidden text-sm text-slate-400">Quitter</button>
        </div>

        <div id="login-section" class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
            <h2 class="text-center font-bold mb-6 text-slate-700">Accès Équipe</h2>
            <input id="pseudo" type="text" placeholder="Identifiant" class="w-full border p-4 mb-3 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            <input id="password" type="password" placeholder="Code secret" class="w-full border p-4 mb-6 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
            <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-4 rounded-2xl shadow-lg hover:bg-blue-700 transition">OUVRIR LA SESSION</button>
        </div>

        <div id="main-app" class="hidden space-y-4">
            
            <div class="flex bg-white p-1 rounded-2xl shadow-sm border mb-4">
                <button onclick="showTab('stock')" class="flex-1 py-2 text-sm font-bold rounded-xl tab-btn active bg-blue-100 text-blue-700">📦 Stock</button>
                <button onclick="showTab('achats')" class="flex-1 py-2 text-sm font-bold rounded-xl tab-btn">🛒 Achats</button>
                <button onclick="showTab('logs')" class="flex-1 py-2 text-sm font-bold rounded-xl tab-btn">📜 Historique</button>
            </div>

            <div id="tab-stock" class="tabs-content active space-y-4">
                <div class="flex gap-2">
                    <input id="search" oninput="chargerProduits()" type="text" placeholder="Rechercher..." class="flex-1 border p-3 rounded-2xl shadow-sm outline-none">
                    <button onclick="startScan()" class="bg-slate-800 text-white px-4 rounded-2xl shadow-md">📷</button>
                </div>
                <div id="reader" class="hidden rounded-xl overflow-hidden border-2 border-blue-500"></div>

                <details class="bg-white rounded-2xl border shadow-sm">
                    <summary class="p-4 font-bold text-slate-700 cursor-pointer">➕ Ajouter un nouvel article</summary>
                    <div class="p-4 space-y-2 border-t">
                        <input id="nom" type="text" placeholder="Nom de l'article" class="w-full border p-2 rounded-lg bg-slate-50">
                        <div class="grid grid-cols-2 gap-2">
                            <input id="emplacement" type="text" placeholder="Emplacement" class="border p-2 rounded-lg bg-slate-50">
                            <input id="qty" type="number" placeholder="Quantité" class="border p-2 rounded-lg bg-slate-50">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input id="prix" type="number" step="0.01" placeholder="Prix d'achat (€)" class="border p-2 rounded-lg bg-slate-50">
                            <input id="seuil" type="number" placeholder="Seuil d'alerte" class="border p-2 rounded-lg bg-slate-50">
                        </div>
                        <input id="photo-file" type="file" accept="image/*" class="text-xs block w-full">
                        <button onclick="ajouterArticle()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold mt-2">ENREGISTRER</button>
                    </div>
                </details>

                <div id="liste-produits" class="grid gap-3"></div>
            </div>

            <div id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border">
                    <h3 class="font-black text-slate-800 mb-1">Budget Réapprovisionnement</h3>
                    <p id="total-budget" class="text-2xl text-blue-600 font-black">0.00 €</p>
                    <button onclick="exportToExcel()" id="admin-excel" class="hidden mt-3 text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">Exporter Excel (Admin)</button>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </div>

            <div id="tab-logs" class="tabs-content">
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-3">Date</th>
                                <th class="p-3">Utilisateur</th>
                                <th class="p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="liste-logs"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P";
        const sb = supabase.createClient(S_URL, S_KEY);

        let userPseudo = "";

        // --- AUTH ---
        async function login() {
            const pseudo = document.getElementById('pseudo').value;
            const password = document.getElementById('password').value;
            // On transforme le pseudo en email fictif pour Supabase
            const email = pseudo.toLowerCase() + "@emasi.stock";
            
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert("Identifiant ou code incorrect");
            else {
                userPseudo = pseudo;
                checkUser();
            }
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                if(user.email === "thierry@emasi.stock") document.getElementById('admin-excel').classList.remove('hidden');
                chargerProduits();
                chargerLogs();
            }
        }

        // --- NAVIGATION ---
        function showTab(tabName) {
            document.querySelectorAll('.tabs-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'bg-blue-100', 'text-blue-700'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active', 'bg-blue-100', 'text-blue-700');
            if(tabName === 'achats') calculerAchats();
        }

        // --- CORE FUNCTIONS ---
        async function chargerProduits() {
            const search = document.getElementById('search').value.toLowerCase();
            let { data, error } = await sb.from('produits').select('*').order('nom');
            if (search) data = data.filter(p => p.nom.toLowerCase().includes(search) || (p.emplacement && p.emplacement.toLowerCase().includes(search)));

            const liste = document.getElementById('liste-produits');
            liste.innerHTML = data.map(p => `
                <div class="bg-white p-3 rounded-2xl border shadow-sm flex items-center gap-3 ${p.quantite <= p.seuil_critique ? 'low-stock border-red-200' : ''}">
                    <img src="${p.image_url || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-xl object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-sm">${p.nom}</h3>
                            <span class="text-xs font-black ${p.quantite <= p.seuil_critique ? 'text-red-600' : 'text-blue-600'}">x${p.quantite}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">📍 ${p.emplacement || 'Non classé'}</p>
                        <div class="flex gap-2 mt-2">
                            <button onclick="updateQty('${p.id}', ${p.quantite - 1}, '${p.nom}')" class="bg-slate-100 w-8 h-8 rounded-lg font-bold">-</button>
                            <button onclick="updateQty('${p.id}', ${p.quantite + 1}, '${p.nom}')" class="bg-slate-100 w-8 h-8 rounded-lg font-bold">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateQty(id, newQty, nom) {
            if(newQty < 0) return;
            const diff = newQty > 0 ? (newQty > 1 ? 'Modif' : 'Retrait') : 'Rupture';
            await sb.from('produits').update({ quantite: newQty }).eq('id', id);
            await logAction(nom, diff, newQty);
            chargerProduits();
        }

        async function logAction(nom, action, qty) {
            await sb.from('historique').insert([{ produit_nom: nom, utilisateur: userPseudo, action: action, quantite_modifiee: qty }]);
        }

        async function chargerLogs() {
            const { data } = await sb.from('historique').select('*').order('date_action', { ascending: false }).limit(20);
            document.getElementById('liste-logs').innerHTML = data.map(l => `
                <tr class="border-b">
                    <td class="p-3 text-[10px]">${new Date(l.date_action).toLocaleDateString()}</td>
                    <td class="p-3 font-bold text-blue-600">${l.utilisateur}</td>
                    <td class="p-3">${l.produit_nom} (${l.action})</td>
                </tr>
            `).join('');
        }

        async function calculerAchats() {
            const { data } = await sb.from('produits').select('*');
            const aAcheter = data.filter(p => p.quantite <= p.seuil_critique);
            let total = 0;

            document.getElementById('liste-achats').innerHTML = aAcheter.map(p => {
                const besoin = (p.seuil_critique + 5) - p.quantite; // On commande de quoi dépasser le seuil
                const sousTotal = besoin * p.prix_unitaire;
                total += sousTotal;
                return `
                    <div class="bg-white p-3 rounded-2xl border-l-4 border-red-500 shadow-sm">
                        <div class="flex justify-between font-bold text-sm">
                            <span>${p.nom}</span>
                            <span class="text-red-600">Manque: ${besoin}</span>
                        </div>
                        <p class="text-[10px] text-slate-400">Prix est. : ${sousTotal.toFixed(2)} €</p>
                    </div>
                `;
            }).join('');
            document.getElementById('total-budget').innerText = total.toFixed(2) + " €";
        }

        async function ajouterArticle() {
            const nom = document.getElementById('nom').value;
            const quantite = parseInt(document.getElementById('qty').value);
            const prix_unitaire = parseFloat(document.getElementById('prix').value) || 0;
            const seuil_critique = parseInt(document.getElementById('seuil').value) || 2;
            const photoFile = document.getElementById('photo-file').files[0];
            let image_url = "";

            if (photoFile) {
                const fileName = `${Date.now()}_${photoFile.name}`;
                const { data: upData } = await sb.storage.from('photos-stock').upload(fileName, photoFile);
                const { data: urlData } = sb.storage.from('photos-stock').getPublicUrl(fileName);
                image_url = urlData.publicUrl;
            }

            await sb.from('produits').insert([{ nom, quantite, prix_unitaire, seuil_critique, image_url, emplacement: document.getElementById('emplacement').value }]);
            location.reload();
        }

        // --- SCANNER ---
        function startScan() {
            const reader = document.getElementById('reader');
            reader.classList.toggle('hidden');
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
                (decodedText) => {
                    document.getElementById('search').value = decodedText;
                    chargerProduits();
                    html5QrCode.stop();
                    reader.classList.add('hidden');
                }
            );
        }

        async function exportToExcel() {
            const { data } = await sb.from('produits').select('nom, quantite, prix_unitaire, emplacement');
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Stock");
            XLSX.writeFile(workbook, "EMASI_STOCK.xlsx");
        }

        checkUser();
    </script>
</body>
</html>
