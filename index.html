<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI - V1.8</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .card-info { background: white; border-radius: 1.5rem; padding: 1rem; border: 1px solid #e2e8f0; }
        .low-stock { border: 2px solid #ef4444; background: #fff1f2; }
        #notifier { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 80%; }
    </style>
</head>
<body class="pb-32">

    <div id="notifier" class="glass border-2 border-blue-500 p-6 rounded-[2rem] shadow-2xl text-center">
        <p id="notify-msg" class="font-black uppercase text-blue-800 text-sm"></p>
    </div>

    <div class="max-w-xl mx-auto p-4">
        <header id="app-header" class="hidden flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-900">RTE <span class="text-blue-500">EMASI</span></h1>
            <button onclick="logout()" class="text-[10px] font-bold bg-white px-4 py-2 rounded-full border">QUITTER</button>
        </header>

        <div id="login-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl mt-10">
            <input id="pseudo" type="email" placeholder="E-mail" class="w-full bg-slate-100 p-4 rounded-xl mb-4 font-bold outline-none">
            <input id="password" type="password" placeholder="Mot de passe" class="w-full bg-slate-100 p-4 rounded-xl mb-4 font-bold outline-none">
            <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-4 rounded-xl uppercase">Connexion</button>
        </div>

        <main id="main-app" class="hidden space-y-4">
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-lg glass border rounded-[2rem] flex justify-around p-3 z-50 shadow-2xl">
                <button onclick="showTab('pieces')" class="tab-btn active text-blue-600 font-black text-[10px] flex flex-col items-center">📦 <span>PIÈCES</span></button>
                <button onclick="showTab('materiel')" class="tab-btn text-slate-400 font-black text-[10px] flex flex-col items-center">🛠️ <span>MATOS</span></button>
                <button onclick="showTab('admin')" class="tab-btn text-slate-400 font-black text-[10px] flex flex-col items-center">⚙️ <span>ADMIN</span></button>
            </nav>

            <section id="tab-pieces" class="tabs-content active space-y-4">
                <div class="flex gap-2">
                    <input id="search" oninput="chargerDonnees()" type="text" placeholder="Rechercher..." class="flex-1 p-4 rounded-2xl shadow-inner font-bold outline-none">
                    <button onclick="toggleScanner()" class="bg-blue-600 text-white w-14 rounded-2xl">📷</button>
                </div>
                <button onclick="ouvrirForm('PIECE')" class="w-full bg-white border-2 border-dashed border-blue-200 p-3 rounded-2xl font-black text-blue-600 uppercase text-[10px]">+ Nouvel Article</button>
                <div id="liste-pieces" class="grid gap-4"></div>
            </section>

            <section id="tab-materiel" class="tabs-content space-y-4">
                <button onclick="ouvrirForm('MATERIEL')" class="w-full bg-slate-800 text-white p-3 rounded-2xl font-black uppercase text-[10px]">+ Nouveau Matériel</button>
                <div id="liste-materiel" class="grid gap-4"></div>
            </section>

            <section id="tab-admin" class="tabs-content space-y-4">
                <div class="bg-white p-6 rounded-3xl border space-y-4">
                    <button onclick="exporterExcel()" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-black text-xs uppercase">📥 Télécharger le Tableau (Excel)</button>
                    <div class="border-t pt-4">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Importer un fichier CSV</label>
                        <input type="file" id="csv-import" accept=".csv" class="block w-full text-xs mt-2">
                        <button onclick="importerExcel()" class="w-full bg-blue-100 text-blue-700 p-3 rounded-xl font-black text-[10px] uppercase mt-2">🚀 Lancer l'importation</button>
                    </div>
                </div>
            </section>

            <div id="form-container" class="hidden fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
                <div class="max-w-xl mx-auto space-y-4 pb-24">
                    <div class="flex justify-between items-center">
                        <h2 class="font-black text-blue-900 uppercase">Fiche Article</h2>
                        <button onclick="toggleForm()" class="text-2xl font-bold">✕</button>
                    </div>

                    <div class="relative w-full h-44 bg-slate-100 rounded-3xl overflow-hidden border-2 border-dashed border-slate-300 flex items-center justify-center">
                        <div id="photo-preview" class="w-full h-full flex items-center justify-center">📸</div>
                        <input type="file" id="photo-input" capture="environment" accept="image/*" class="hidden" onchange="traiterPhoto(this)">
                        <button onclick="document.getElementById('photo-input').click()" class="absolute bottom-2 right-2 bg-blue-600 text-white px-4 py-2 rounded-full font-black text-[9px]">PHOTO</button>
                    </div>
                    <input type="hidden" id="photo-url">

                    <div class="space-y-3">
                        <input id="edit-id" type="hidden"><input id="edit-type" type="hidden">
                        <input id="nom" type="text" placeholder="DÉSIGNATION" class="w-full bg-slate-50 p-4 rounded-xl font-bold border uppercase">
                        <input id="barcode" type="text" placeholder="CODE-BARRES" class="w-full bg-slate-50 p-4 rounded-xl font-mono text-blue-600 border">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[9px] font-black text-slate-400 ml-1">ZONE</label>
                                <select id="zone-1" class="w-full bg-slate-50 p-4 rounded-xl font-bold border">
                                    <option value="ATELIER">ATELIER</option>
                                    <option value="LABO">LABO</option>
                                    <option value="BUREAU">BUREAU</option>
                                    <option value="STOCK CENTRAL">STOCK CENTRAL</option>
                                    <option value="AUTRE">AUTRE...</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[9px] font-black text-slate-400 ml-1">PRÉCISION (RAYON/TIROIR)</label>
                                <input id="zone-2" type="text" class="w-full bg-slate-50 p-4 rounded-xl font-bold border uppercase" placeholder="EX: A1-02">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <input id="qty" type="number" placeholder="STOCK" class="w-full bg-slate-50 p-4 rounded-xl font-black border">
                            <input id="seuil" type="number" placeholder="SEUIL" class="w-full bg-slate-50 p-4 rounded-xl font-black border">
                        </div>
                    </div>

                    <button onclick="sauvegarder()" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase shadow-lg">Enregistrer</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";

        function notify(msg) {
            const b = document.getElementById('notifier');
            document.getElementById('notify-msg').innerText = msg.toUpperCase();
            b.style.display = "block";
            setTimeout(() => b.style.display = "none", 2500);
        }

        async function login() {
            const e = document.getElementById('pseudo').value;
            const p = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email: e.includes('@') ? e : e + "@emasi.stock", password: p });
            if (error) alert("Identifiants incorrects"); else checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                chargerDonnees();
            }
        }

        async function chargerDonnees() {
            const { data } = await sb.from('produits').select('*').order('nom');
            render(data || []);
        }

        function render(data) {
            const s = document.getElementById('search').value.toLowerCase();
            const pieces = data.filter(p => (!p.categorie || p.categorie === 'PIECE') && p.nom.toLowerCase().includes(s));
            
            document.getElementById('liste-pieces').innerHTML = pieces.map(p => `
                <div class="card-info ${p.quantite <= (p.seuil_critique||0) ? 'low-stock' : ''}">
                    <div class="flex gap-4">
                        <div class="w-20 h-20 rounded-xl bg-slate-100 overflow-hidden border">
                            ${p.image_url ? `<img src="${p.image_url}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-[8px] text-slate-300 italic">SANS PHOTO</div>`}
                        </div>
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-black text-slate-800 text-[11px] uppercase truncate">${p.nom}</h3>
                                <p class="text-[9px] font-bold text-blue-600">📍 ${p.zone_principale || ''} - ${p.zone_precision || ''}</p>
                                <p class="text-[8px] font-mono text-slate-400">${p.barcode || 'SANS CODE'}</p>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[8px] font-black text-slate-300">SEUIL: ${p.seuil_critique || 0}</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="updateStock('${p.id}', -1, '${p.nom}')" class="w-7 h-7 bg-slate-100 rounded-lg font-black">-</button>
                                    <span class="font-black text-sm">${p.quantite || 0}</span>
                                    <button onclick="updateStock('${p.id}', 1, '${p.nom}')" class="w-7 h-7 bg-slate-100 rounded-lg font-black text-blue-600">+</button>
                                    <button onclick="ouvrirForm('PIECE', '${p.id}')" class="ml-2">⚙️</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function exporterExcel() {
            const { data } = await sb.from('produits').select('*');
            const entetes = ["Designation", "Barcode", "Zone", "Precision", "Stock", "Seuil", "Categorie"];
            let csv = entetes.join(";") + "\n";
            data.forEach(r => {
                csv += `"${r.nom}";"${r.barcode||''}";"${r.zone_principale||''}";"${r.zone_precision||''}";"${r.quantite}";"${r.seuil_critique}";"${r.categorie}"\n`;
            });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "STOCK_RTE.csv";
            link.click();
        }

        async function importerExcel() {
            const file = document.getElementById('csv-import').files[0];
            if(!file) return alert("Sélectionnez un fichier .csv");
            const reader = new FileReader();
            reader.onload = async (e) => {
                const lignes = e.target.result.split("\n").slice(1);
                const items = lignes.map(l => {
                    const c = l.split(";").map(x => x.replace(/"/g, '').trim());
                    if(c.length < 2 || !c[1]) return null; // Ignore si pas de barcode
                    return { 
                        nom: c[0], 
                        barcode: c[1], 
                        zone_principale: c[2].toUpperCase(), 
                        zone_precision: c[3].toUpperCase(), 
                        quantite: parseInt(c[4])||0, 
                        seuil_critique: parseInt(c[5])||0, 
                        categorie: c[6]||'PIECE'
                    };
                }).filter(x => x !== null);

                // UPSERT basé sur le barcode qui est maintenant UNIQUE
                const { error } = await sb.from('produits').upsert(items, { onConflict: 'barcode' });
                if(error) alert("Erreur : " + error.message);
                else { notify("IMPORT RÉUSSI"); chargerDonnees(); }
            };
            reader.readAsText(file);
        }

        async function sauvegarder() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                nom: document.getElementById('nom').value.toUpperCase(),
                barcode: document.getElementById('barcode').value,
                zone_principale: document.getElementById('zone-1').value,
                zone_precision: document.getElementById('zone-2').value.toUpperCase(),
                quantite: parseInt(document.getElementById('qty').value) || 0,
                seuil_critique: parseInt(document.getElementById('seuil').value) || 0,
                image_url: document.getElementById('photo-url').value,
                categorie: document.getElementById('edit-type').value
            };
            if(id) await sb.from('produits').update(payload).eq('id', id);
            else await sb.from('produits').insert([payload]);
            toggleForm(); chargerDonnees(); notify("ENREGISTRÉ");
        }

        function ouvrirForm(type, id = null) {
            document.querySelectorAll('#form-container input').forEach(i => i.value = "");
            document.getElementById('photo-preview').innerHTML = "📸";
            document.getElementById('edit-id').value = id || "";
            document.getElementById('edit-type').value = type;
            if(id) chargerFiche(id);
            document.getElementById('form-container').classList.remove('hidden');
        }

        async function chargerFiche(id) {
            const { data } = await sb.from('produits').select('*').eq('id', id).single();
            document.getElementById('nom').value = data.nom;
            document.getElementById('barcode').value = data.barcode || "";
            document.getElementById('zone-1').value = data.zone_principale || "ATELIER";
            document.getElementById('zone-2').value = data.zone_precision || "";
            document.getElementById('qty').value = data.quantite;
            document.getElementById('seuil').value = data.seuil_critique;
            document.getElementById('photo-url').value = data.image_url || "";
            if(data.image_url) document.getElementById('photo-preview').innerHTML = `<img src="${data.image_url}" class="w-full h-full object-cover">`;
        }

        // Fonctions standards (Scanner, Tab, Stock...) identiques
        function showTab(t) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
        }
        function toggleForm() { document.getElementById('form-container').classList.toggle('hidden'); }
        async function updateStock(id, diff, nom) {
            const { data } = await sb.from('produits').select('quantite').eq('id', id).single();
            await sb.from('produits').update({ quantite: (data.quantite || 0) + diff }).eq('id', id);
            chargerDonnees();
        }
        async function traiterPhoto(input) {
            const file = input.files[0];
            const comp = await imageCompression(file, { maxSizeMB: 0.1 });
            const path = `img_${Date.now()}.webp`;
            await sb.storage.from('photos-stock').upload(path, comp);
            const { data } = sb.storage.from('photos-stock').getPublicUrl(path);
            document.getElementById('photo-url').value = data.publicUrl;
            document.getElementById('photo-preview').innerHTML = `<img src="${data.publicUrl}" class="w-full h-full object-cover">`;
        }
        async function logout() { await sb.auth.signOut(); location.reload(); }
        checkUser();
    </script>
</body>
</html>
