<script>
const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P";
const sb = supabase.createClient(S_URL, S_KEY);

let userPseudo = "";
let html5QrCode;

/* ===========================
   AUTH (INCHANGÉ & STABLE)
=========================== */

async function login() {
    const p = document.getElementById('pseudo').value;
    const pw = document.getElementById('password').value;
    if(!p || !pw) return alert("Remplir les champs");

    const emailFinal = p.toLowerCase().trim() + "@emasi.stock";

    const { error } = await sb.auth.signInWithPassword({
        email: emailFinal,
        password: pw
    });

    if(error){
        alert("Identifiants incorrects.");
        return;
    }

    await checkUser();
}

async function logout() {
    await sb.auth.signOut();
    location.reload();
}

async function checkUser() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
        userPseudo = user.email.split('@')[0].toUpperCase();
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('btn-logout').classList.remove('hidden');
        chargerDonnees();
    }
}

/* ===========================
   DATA
=========================== */

async function chargerDonnees() {
    const { data } = await sb.from('produits').select('*').order('nom');
    renderListes(data);
    calculerBudget(data);
}

async function sauvegarder() {

    const id = document.getElementById('edit-id').value;
    const type = document.getElementById('edit-type').value;

    const payload = {
        nom: document.getElementById('nom').value.trim(),
        barcode: document.getElementById('barcode').value.trim(),
        emplacement: `${zone-1.value} - ${zone-2.value}`,
        prix_unitaire: parseFloat(prix.value) || 0,
        image_url: photo-url.value,
        categorie: type,
        quantite: type === 'PIECE' ? parseInt(qty.value) || 0 : 1,
        seuil_critique: type === 'PIECE' ? parseInt(seuil.value) || 0 : 0,
        etat: type === 'MATERIEL' ? etat-materiel.value : 'OK'
    };

    if(!payload.nom) return alert("Nom manquant");

    if(id){
        await sb.from('produits').update(payload).eq('id', id);
        await logAction(payload.nom, "MODIFICATION");
    } else {
        await sb.from('produits').insert([payload]);
        await logAction(payload.nom, "CREATION");
    }

    toggleForm();
    chargerDonnees();
}

async function updateStock(id, diff, nom) {
    const { data } = await sb.from('produits').select('quantite').eq('id', id).single();
    const newQ = (data.quantite || 0) + diff;
    if(newQ < 0) return;

    await sb.from('produits').update({ quantite: newQ }).eq('id', id);
    await logAction(nom, diff > 0 ? "AJOUT STOCK" : "SORTIE STOCK");
    chargerDonnees();
}

/* ===========================
   HISTORIQUE CENTRALISÉ
=========================== */

async function logAction(nom, action){
    await sb.from('historique').insert([{
        produit_nom: nom,
        utilisateur: userPseudo,
        action: action,
        date_action: new Date()
    }]);
}

async function chargerLogs(){
    const { data } = await sb.from('historique')
        .select('*')
        .order('date_action',{ascending:false})
        .limit(50);

    document.getElementById('liste-logs').innerHTML =
        data.map(l => `
        <div class="p-4 text-[9px] uppercase font-black bg-white flex justify-between">
            <div>${l.produit_nom}<br>
            <span class="text-slate-300">${new Date(l.date_action).toLocaleString()}</span>
            </div>
            <div class="text-blue-600">${l.action}</div>
        </div>
    `).join('');
}

/* ===========================
   SUPPRESSION SÉCURISÉE
=========================== */

async function supprimerArticle(){
    const id = document.getElementById('edit-id').value;
    const nom = document.getElementById('nom').value;

    if(!confirm("⚠ Supprimer définitivement ?")) return;
    if(!confirm("Cette action est irréversible. Confirmer ?")) return;

    const url = photo-url.value;

    if(url){
        const fileName = url.split('/').pop();
        await sb.storage.from('photos-stock').remove([fileName]);
    }

    await sb.from('produits').delete().eq('id', id);
    await logAction(nom, "SUPPRESSION");

    toggleForm();
    chargerDonnees();
}

/* ===========================
   BUDGET
=========================== */

function calculerBudget(data){
    let total = 0;

    data.forEach(p=>{
        if(p.categorie === "MATERIEL" && p.etat === "HS"){
            total += p.prix_unitaire;
        }
        if((p.categorie || "PIECE") === "PIECE" && p.quantite <= p.seuil_critique){
            total += (p.seuil_critique - p.quantite) * p.prix_unitaire;
        }
    });

    total-budget.innerText =
        total.toLocaleString('fr-FR',{minimumFractionDigits:2}) + " €";
}

checkUser();
</script>
