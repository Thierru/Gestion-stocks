<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTE EMASI Login Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<style>
body { font-family: sans-serif; background: #f8fafc; }
#login-section { max-width: 400px; margin: 50px auto; padding: 20px; background: #fff; border-radius: 20px; }
input, button { width: 100%; padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<div id="login-section">
    <h2>Connexion</h2>
    <input id="pseudo" type="email" placeholder="E-mail">
    <input id="password" type="password" placeholder="Mot de passe">
    <button id="btn-login">Se connecter</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
    const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P";
    const sb = supabase.createClient(S_URL, S_KEY);

    async function login() {
        const email = document.getElementById('pseudo').value;
        const password = document.getElementById('password').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
            alert("Email ou mot de passe invalide : " + error.message);
            return;
        }
        alert("Connexion réussie !");
    }

    document.getElementById('btn-login').addEventListener('click', login);
});
</script>
</body>
</html>
