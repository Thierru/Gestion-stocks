<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI - V1.1 FINALE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .tabs-content { display: none; }
        .tabs-content.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .low-stock { border: 2px solid #ef4444 !important; background: #fef2f2; }
        .status-hs { border: 2px solid #991b1b !important; background: #fff1f2; }
        #reader { width: 100%; border-radius: 24px; overflow: hidden; background: black; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        label { font-size: 0.7rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="min-h-screen pb-32">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <header id="app-header" class="hidden flex justify-between items-center mb-6 px-2">
            <div>
                <h1 class="text-2xl font-black text-blue-900 leading-none">RTE <span class="text-blue-500">EMASI</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-[0.3em] uppercase">Lorraine • ACCÈS PRIVÉ</p>
            </div>
            <button onclick="logout()" class="glass text-[10px] px-4 py-2 rounded-full font-black border border-slate-200 uppercase shadow-sm">Déconnexion</button>
        </header>

        <div id="login-section" class="bg-white p-8 rounded-[3rem] shadow-2xl border border-slate-100 mt-20">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🔐</div>
                <h2 class="font-black text-slate-800 uppercase tracking-widest">Espace Privé</h2>
            </div>
            <div class="space-y-4">
                <input id="pseudo" type="text" placeholder="Utilisateur" class="w-full border-0 bg-slate-100 p-5 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <input id="password" type="password" placeholder="Code Secret" class="w-full border-0 bg-slate-100 p-5 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold">
                <button onclick="login()" id="btn-login-action" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl shadow-lg uppercase tracking-widest active:scale-95 transition-transform">Entrer</button>
            </div>
        </div>

        <main id="main-app" class="hidden space-y-4">
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg glass border border-white rounded-[2.5rem] flex justify-around p-3 z-50 shadow-2xl">
                <button onclick="showTab('pieces')" class="tab-btn active text-blue-600 flex flex-col items-center">
                    <span class="text-xl">📦</span><span class="text-[9px] font-black uppercase mt-1">Pièces</span>
                </button>
                <button onclick="showTab('materiel')" class="tab-btn text-slate-400 flex flex-col items-center">
                    <span class="text-xl">🛠️</span><span class="text-[9px] font-black uppercase mt-1">Matériel</span>
                </button>
                <button onclick="showTab('achats')" class="tab-btn text-slate-400 flex flex-col items-center">
                    <span class="text-xl">🛒</span><span class="text-[9px] font-black uppercase mt-1">Budget</span>
                </button>
                <button onclick="showTab('logs')" class="tab-btn text-slate-400 flex flex-col items-center">
                    <span class="text-xl">📜</span><span class="text-[9px] font-black uppercase mt-1">Logs</span>
                </button>
            </nav>

            <div id="scanner-container" class="hidden fixed inset-0 bg-black/95 z-[200] flex flex-col p-6 items-center justify-center">
                <div id="reader" class="w-full border-4 border-white/10 rounded-3xl"></div>
                <button onclick="toggleScanner()" class="mt-10 bg-white/10 text-white px-8 py-4 rounded-full font-black uppercase text-xs">Fermer</button>
            </div>

            <section id="tab-pieces" class="tabs-content active space-y-4">
                <div class="flex gap-2">
                    <input id="search" oninput="chargerDonnees()" type="text" placeholder="Chercher une pièce..." class="flex-1 glass border-white border p-5 rounded-3xl shadow-sm outline-none font-bold">
                    <button onclick="toggleScanner()" class="bg-blue-600 text-white w-16 rounded-3xl shadow-lg flex items-center justify-center text-xl">📷</button>
                </div>
                <button onclick="ouvrirForm('PIECE')" class="w-full bg-white text-blue-600 p-4 rounded-3xl font-black text-[10px] uppercase shadow-sm border border-blue-50">+ Ajouter un article</button>
                <div id="liste-pieces" class="grid gap-3"></div>
            </section>

            <section id="tab-materiel" class="tabs-content space-y-4">
                <div class="flex gap-2">
                    <input id="search-mat" oninput="chargerDonnees()" type="text" placeholder="Chercher un appareil..." class="flex-1 glass border-white border p-5 rounded-3xl shadow-sm outline-none font-bold">
                    <button onclick="toggleScanner()" class="bg-slate-800 text-white w-16 rounded-3xl shadow-lg flex items-center justify-center text-xl">📷</button>
                </div>
                <button onclick="ouvrirForm('MATERIEL')" class="w-full bg-slate-800 text-white p-4 rounded-3xl font-black text-[10px] uppercase shadow-lg">+ Ajouter un article</button>
                <div id="liste-materiel" class="grid gap-3"></div>
            </section>

            <div id="form-container" class="hidden fixed inset-0 bg-white z-[100] p-6 overflow-y-auto">
                <div class="max-w-xl mx-auto space-y-5 pb-28">
                    <header class="flex justify-between items-center">
                        <h2 id="form-title" class="text-xl font-black text-blue-900 uppercase">Fiche Article</h2>
                        <button onclick="toggleForm()" class="bg-slate-100 w-10 h-10 rounded-full font-bold">✕</button>
                    </header>

                    <div class="bg-slate-50 p-6 rounded-[2.5rem] flex flex-col items-center gap-4 border-2 border-dashed border-slate-200">
                        <div id="photo-preview" class="w-40 h-40 rounded-[2rem] bg-white shadow-inner overflow-hidden flex items-center justify-center border-4 border-white">
                            <span class="text-[10px] text-slate-300 font-black uppercase">Pas d'image</span>
                        </div>
                        <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden" onchange="traiterEtUploaderPhoto(this)">
                        <button onclick="document.getElementById('photo-input').click()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-black text-[10px] uppercase shadow-lg">Prendre photo</button>
                        <input type="hidden" id="photo-url">
                    </div>

                    <input id="edit-id" type="hidden">
                    <input id="edit-type" type="hidden">
                    
                    <div class="space-y-4">
                        <div><label>Désignation</label><input id="nom" type="text" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold"></div>
                        <div><label>ID Code (Affiché en liste)</label><input id="barcode" type="text" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-mono text-blue-600"></div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div><label>Zone</label><select id="zone-1" class="w-full bg-slate-100 p-4 rounded-2xl font-bold"><option value="LABO">LABO</option><option value="ATELIER">ATELIER</option><option value="BUREAU">BUREAU</option></select></div>
                            <div><label>Précision</label><input id="zone-2" type="text" class="w-full bg-slate-100 p-4 rounded-2xl"></div>
                        </div>

                        <div id="fields-piece" class="grid grid-cols-2 gap-3">
                            <div><label>En Stock</label><input id="qty" type="number" class="w-full bg-slate-100 p-4 rounded-2xl font-black"></div>
                            <div><label>Seuil Alerte</label><input id="seuil" type="number" class="w-full bg-slate-100 p-4 rounded-2xl font-black"></div>
                        </div>

                        <div id="fields-materiel" class="hidden">
                            <label>État actuel</label>
                            <select id="etat-materiel" class="w-full bg-slate-100 p-4 rounded-2xl font-black"><option value="OK">✅ OPÉRATIONNEL</option><option value="HS">❌ HS (À REMPLACER)</option><option value="CO">⏳ EN ÉTALONNAGE</option></select>
                        </div>

                        <div><label>Prix estimé HT (€)</label><input id="prix" type="number" step="0.01" class="w-full bg-slate-100 p-4 rounded-2xl font-bold"></div>
                    </div>
                    
                    <button onclick="sauvegarder()" id="btn-save" class="w-full bg-blue-600 text-white p-6 rounded-3xl font-black uppercase shadow-xl tracking-widest active:scale-95 transition-transform">Enregistrer</button>
                    <button id="btn-delete" onclick="supprimerArticle()" class="w-full text-red-500 font-bold text-[10px] uppercase pt-4 hidden">Supprimer l'article</button>
                </div>
            </div>

            <section id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-blue-900 p-10 rounded-[3rem] text-white text-center shadow-2xl relative overflow-hidden">
                    <p class="text-[10px] uppercase font-black opacity-50 tracking-widest">Budget Estimation</p>
                    <h2 id="total-budget" class="text-4xl font-black mt-2">0.00 €</h2>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </section>

            <section id="tab-logs" class="tabs-content space-y-4">
                <div id="liste-logs" class="bg-white rounded-[2rem] border divide-y overflow-hidden shadow-sm"></div>
            </section>
        </main>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";
        let html5QrCode;

        function notifier(msg, success = true) {
            const t = document.createElement('div');
            t.className = `fixed top-6 left-1/2 -translate-x-1/2 px-8 py-4 rounded-full text-[10px] font-black z-[300] shadow-2xl transition-all border glass ${success ? 'text-emerald-600 border-emerald-100' : 'text-blue-600 border-blue-100'}`;
            t.innerHTML = msg.toUpperCase(); document.body.appendChild(t);
            setTimeout(() => { t.classList.add('opacity-0'); setTimeout(() => t.remove(), 500); }, 2500);
        }

        async function login() {
            const btn = document.getElementById('btn-login-action');
            btn.innerText = "ACCÈS...";
            const p = document.getElementById('pseudo').value;
            const pw = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email: p.toLowerCase().trim() + "@emasi.stock", password: pw });
            if (error) { alert("Identifiants incorrects"); btn.innerText = "ENTRER"; } else checkUser();
        }

        async function logout() { await sb.auth.signOut(); location.reload(); }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                chargerDonnees();
            }
        }

        async function traiterEtUploaderPhoto(input) {
            const file = input.files[0]; if (!file) return;
            const preview = document.getElementById('photo-preview');
            const saveBtn = document.getElementById('btn-save');
            const oldUrl = document.getElementById('photo-url').value;
            preview.innerHTML = `<div class="animate-spin text-2xl">⏳</div>`;
            saveBtn.disabled = true;

            try {
                if (oldUrl && oldUrl.includes('photos-stock')) {
                    const name = oldUrl.split('/').pop();
                    await sb.storage.from('photos-stock').remove([name]);
                }
                const compressed = await imageCompression(file, { maxSizeMB: 0.1, maxWidthOrHeight: 800, useWebWorker: true, fileType: 'image/webp' });
                const newName = `art_${Date.now()}.webp`;
                await sb.storage.from('photos-stock').upload(newName, compressed);
                const { data: urlData } = sb.storage.from('photos-stock').getPublicUrl(newName);
                document.getElementById('photo-url').value = urlData.publicUrl;
                preview.innerHTML = `<img src="${urlData.publicUrl}" class="w-full h-full object-cover">`;
                notifier("Photo chargée");
            } catch (err) { notifier("Erreur Photo", false); }
            finally { saveBtn.disabled = false; }
        }

        async function chargerDonnees() {
            const { data } = await sb.from('produits').select('*').order('nom');
            renderListes(data || []);
            calculerBudget(data || []);
        }

        function renderListes(data) {
            const s1 = document.getElementById('search').value.toLowerCase();
            const s2 = document.getElementById('search-mat').value.toLowerCase();
            const pieces = data.filter(p => (!p.categorie || p.categorie === 'PIECE') && p.nom.toLowerCase().includes(s1));
            const materiel = data.filter(p => p.categorie === 'MATERIEL' && p.nom.toLowerCase().includes(s2));

            document.getElementById('liste-pieces').innerHTML = pieces.map(p => `
                <div class="bg-white p-4 rounded-[2rem] shadow-sm flex gap-4 items-center border border-white ${p.quantite <= p.seuil_critique ? 'low-stock' : ''}">
                    <div class="w-16 h-16 rounded-2xl bg-slate-50 overflow-hidden flex-shrink-0 border flex items-center justify-center">
                        ${p.image_url ? `<img src="${p.image_url}" loading="lazy" class="w-full h-full object-cover">` : `📦`}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-black text-slate-800 text-[11px] uppercase truncate">${p.nom}</h3>
                        <p class="text-[8px] text-blue-500 font-bold font-mono uppercase mt-1">ID: ${p.barcode || 'SANS CODE'}</p>
                        <p class="text-[7px] text-slate-400 font-bold uppercase tracking-tighter">📍 ${p.emplacement} | SEUIL: ${p.seuil_critique || 0}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex flex-col gap-1">
                            <button onclick="updateStock('${p.id}', 1, '${p.nom}')" class="bg-slate-100 w-8 h-8 rounded-xl font-black text-blue-600">+</button>
                            <button onclick="updateStock('${p.id}', -1, '${p.nom}')" class="bg-slate-100 w-8 h-8 rounded-xl font-black text-slate-400">-</button>
                        </div>
                        <span class="text-2xl font-black min-w-[30px] text-center ${p.quantite <= p.seuil_critique ? 'text-red-500' : 'text-blue-900'}">${p.quantite || 0}</span>
                        <button onclick="ouvrirForm('PIECE', '${p.id}')" class="p-2 text-xl">⚙️</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('liste-materiel').innerHTML = materiel.map(p => `
                <div class="bg-white p-4 rounded-[2rem] shadow-sm border border-white flex gap-4 items-center ${p.etat === 'HS' ? 'status-hs' : ''}">
                    <div class="w-16 h-16 rounded-2xl bg-slate-50 overflow-hidden flex-shrink-0 flex items-center justify-center border">
