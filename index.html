<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RTE EMASI - V1.3 COMPLET</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .low-stock { border: 2px solid #ef4444 !important; background: #fef2f2; }
    </style>
</head>
<body class="min-h-screen pb-32">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <header id="app-header" class="hidden flex justify-between items-center mb-6 px-2">
            <div>
                <h1 class="text-2xl font-black text-blue-900 leading-none">RTE <span class="text-blue-500">EMASI</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-[0.3em] uppercase">Stock & Matériel</p>
            </div>
            <button onclick="logout()" class="glass text-[10px] px-4 py-2 rounded-full font-black border border-slate-200">Quitter</button>
        </header>

        <div id="login-section" class="bg-white p-8 rounded-[3rem] shadow-2xl mt-10">
            <h2 class="font-black text-center text-slate-800 uppercase mb-6">Connexion</h2>
            <div class="space-y-4">
                <input id="pseudo" type="email" placeholder="E-mail (ex: thierry@emasi.stock)" class="w-full bg-slate-100 p-5 rounded-2xl outline-none font-bold">
                <input id="password" type="password" placeholder="Mot de passe" class="w-full bg-slate-100 p-5 rounded-2xl outline-none font-bold">
                <button onclick="login()" id="btn-login-action" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl uppercase shadow-lg">Entrer</button>
            </div>
        </div>

        <main id="main-app" class="hidden space-y-4">
            <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg glass border border-white rounded-[2.5rem] flex justify-around p-3 z-50 shadow-2xl">
                <button onclick="showTab('pieces')" class="tab-btn active text-blue-600 flex flex-col items-center"><span class="text-xl">📦</span><span class="text-[9px] font-black uppercase mt-1">Pièces</span></button>
                <button onclick="showTab('materiel')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">🛠️</span><span class="text-[9px] font-black uppercase mt-1">Matos</span></button>
                <button onclick="showTab('achats')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">🛒</span><span class="text-[9px] font-black uppercase mt-1">Budget</span></button>
                <button onclick="showTab('admin')" class="tab-btn text-slate-400 flex flex-col items-center"><span class="text-xl">⚙️</span><span class="text-[9px] font-black uppercase mt-1">Admin</span></button>
            </nav>

            <section id="tab-pieces" class="tabs-content active space-y-4">
                <div class="flex gap-2">
                    <input id="search" oninput="chargerDonnees()" type="text" placeholder="Rechercher..." class="flex-1 glass p-5 rounded-3xl shadow-sm font-bold">
                    <button onclick="toggleScanner()" class="bg-blue-600 text-white w-16 rounded-3xl shadow-lg text-xl">📷</button>
                </div>
                <div id="liste-pieces" class="grid gap-3"></div>
            </section>

            <section id="tab-materiel" class="tabs-content space-y-4">
                <div id="liste-materiel" class="grid gap-3"></div>
            </section>

            <section id="tab-achats" class="tabs-content space-y-4">
                <div id="total-budget" class="bg-blue-900 p-8 rounded-[2rem] text-white text-3xl font-black text-center">0.00 €</div>
                <div id="liste-achats" class="grid gap-2"></div>
            </section>

            <section id="tab-admin" class="tabs-content space-y-6 bg-white p-6 rounded-[2rem] shadow-sm">
                <h3 class="font-black uppercase text-slate-800 border-b pb-2">Gestion des données</h3>
                
                <div class="space-y-4">
                    <button onclick="exporterExcel()" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-black uppercase text-xs">📊 Exporter vers Excel (CSV)</button>
                    
                    <div class="p-4 border-2 border-dashed border-slate-200 rounded-2xl">
                        <label class="mb-2">Importer depuis Excel (CSV)</label>
                        <input type="file" id="csv-import" accept=".csv" class="text-xs mb-3">
                        <button onclick="importerExcel()" class="w-full bg-blue-100 text-blue-700 p-3 rounded-xl font-black uppercase text-[10px]">🚀 Lancer l'import</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);

        // --- EXPORT EXCEL (CSV) ---
        async function exporterExcel() {
            const { data } = await sb.from('produits').select('*');
            if(!data) return;

            const headers = ["nom", "barcode", "emplacement", "quantite", "seuil_critique", "prix_unitaire", "categorie", "etat"];
            const csvContent = [
                headers.join(","),
                ...data.map(row => headers.map(h => `"${row[h] || ''}"`).join(","))
            ].join("\n");

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `EMASI_STOCK_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        // --- IMPORT EXCEL (CSV) ---
        async function importerExcel() {
            const file = document.getElementById('csv-import').files[0];
            if(!file) return alert("Sélectionnez un fichier .csv");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const rows = e.target.result.split("\n").slice(1);
                const toInsert = rows.map(row => {
                    const cols = row.split(",").map(c => c.replace(/"/g, ''));
                    if(cols.length < 2) return null;
                    return {
                        nom: cols[0], barcode: cols[1], emplacement: cols[2],
                        quantite: parseInt(cols[3]) || 0, seuil_critique: parseInt(cols[4]) || 0,
                        prix_unitaire: parseFloat(cols[5]) || 0, categorie: cols[6] || 'PIECE', etat: cols[7] || 'OK'
                    };
                }).filter(x => x !== null);

                const { error } = await sb.from('produits').upsert(toInsert, { onConflict: 'barcode' });
                if(error) alert("Erreur d'import : " + error.message);
                else { alert("Importation réussie !"); chargerDonnees(); }
            };
            reader.readAsText(file);
        }

        // --- RESTE DES FONCTIONS (Connexion, Affichage...) ---
        async function login() {
            const email = document.getElementById('pseudo').value;
            const pass = document.getElementById('password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password: pass });
            if (error) alert(error.message); else checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                chargerDonnees();
            }
        }

        async function chargerDonnees() {
            const { data } = await sb.from('produits').select('*').order('nom');
            renderListes(data || []);
        }

        function renderListes(data) {
            const pieces = data.filter(p => !p.categorie || p.categorie === 'PIECE');
            const matos = data.filter(p => p.categorie === 'MATERIEL');
            
            document.getElementById('liste-pieces').innerHTML = pieces.map(p => `
                <div class="bg-white p-4 rounded-3xl shadow-sm flex items-center gap-4 ${p.quantite <= (p.seuil_critique||0) ? 'low-stock' : ''}">
                    <div class="flex-1"><h3 class="font-black uppercase text-xs">${p.nom}</h3><p class="text-[9px] text-blue-500 font-mono">${p.barcode || 'SANS ID'}</p></div>
                    <div class="text-xl font-black">${p.quantite}</div>
                </div>
            `).join('');

            document.getElementById('liste-materiel').innerHTML = matos.map(p => `
                <div class="bg-white p-4 rounded-3xl shadow-sm flex items-center justify-between border ${p.etat === 'HS' ? 'border-red-500' : ''}">
                    <h3 class="font-black uppercase text-xs">${p.nom}</h3>
                    <span class="text-[9px] font-bold p-1 rounded bg-slate-100">${p.etat || 'OK'}</span>
                </div>
            `).join('');
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-400'));
            event.currentTarget.classList.replace('text-slate-400', 'text-blue-600');
        }

        checkUser();
    </script>
</body>
</html>
