<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTE EMASI - V1.40</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body class="bg-gray-100">

<!-- LOGIN -->
<div id="login-section" class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow w-80">
        <h2 class="text-2xl font-bold mb-4 text-center">RTE EMASI V1.40</h2>
        <input id="pseudo" placeholder="Pseudo"
            class="border p-2 w-full mb-3">
        <input id="password" type="password" placeholder="Mot de passe"
            class="border p-2 w-full mb-4">
        <button onclick="login()" 
            class="bg-blue-600 text-white w-full p-2 rounded">
            Connexion
        </button>
    </div>
</div>

<!-- APP -->
<div id="main-app" class="hidden p-6">

    <div class="flex justify-between mb-6">
        <h1 class="text-2xl font-bold">Gestion Stock EMASI</h1>
        <button onclick="logout()" 
            class="bg-red-600 text-white px-4 py-2 rounded">
            Déconnexion
        </button>
    </div>

    <!-- Recherche -->
    <input id="search" onkeyup="rechercher()"
        placeholder="Recherche article..."
        class="border p-2 w-full mb-4">

    <!-- Import / Export -->
    <div class="flex gap-4 mb-6">
        <button onclick="exportCSV()" 
            class="bg-blue-600 text-white px-4 py-2 rounded">
            Export CSV
        </button>
        <input type="file" onchange="importCSV(event)">
    </div>

    <!-- Stats -->
    <div id="stats" class="mb-6"></div>
    <canvas id="graph" width="800" height="200"
        class="bg-white shadow mb-6"></canvas>

    <!-- Budget -->
    <div class="bg-white p-4 shadow mb-6">
        <h3 class="font-bold">Budget estimé réapprovisionnement :</h3>
        <div id="total-budget" class="text-xl font-black text-red-600"></div>
    </div>

    <!-- Liste -->
    <div id="liste-produits" class="grid gap-4"></div>

</div>

<script>
const VERSION = "V1.40";
const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P";
const sb = supabase.createClient(S_URL, S_KEY);

let userPseudo = "";
let allProduits = [];

/* ================= AUTH ================= */

async function login() {
    const p = document.getElementById('pseudo').value;
    const pw = document.getElementById('password').value;
    if(!p || !pw) return alert("Remplir les champs");

    const emailFinal = p.toLowerCase().trim() + "@emasi.stock";

    const { error } = await sb.auth.signInWithPassword({
        email: emailFinal,
        password: pw
    });

    if(error){
        alert("Identifiants incorrects");
        return;
    }

    await checkUser();
}

async function logout(){
    await sb.auth.signOut();
    location.reload();
}

async function checkUser(){
    const { data:{ user } } = await sb.auth.getUser();
    if(user){
        userPseudo = user.email.split('@')[0].toUpperCase();
        document.getElementById('login-section').style.display='none';
        document.getElementById('main-app').classList.remove('hidden');
        chargerDonnees();
    }
}

/* ================= DATA ================= */

async function chargerDonnees(){
    const { data } = await sb.from('produits').select('*').order('nom');
    allProduits = data || [];
    renderListes(allProduits);
    calculerBudget(allProduits);
    renderStats();
}

function renderListes(data){
    const container = document.getElementById('liste-produits');
    container.innerHTML="";

    data.forEach(p=>{
        const card = document.createElement('div');
        card.className="bg-white p-4 shadow rounded";

        card.innerHTML=`
            <div class="flex justify-between">
                <div>
                    <div class="font-bold">${p.nom}</div>
                    <div class="text-sm text-gray-500">${p.barcode||''}</div>
                </div>
                <div class="text-right">
                    <div>Qté : ${p.quantite||1}</div>
                    <div>${(p.prix_unitaire||0).toFixed(2)} €</div>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

/* ================= RECHERCHE ================= */

function rechercher(){
    const s = document.getElementById('search').value.toLowerCase();
    const filtered = allProduits.filter(p =>
        p.nom.toLowerCase().includes(s) ||
        (p.barcode||'').toLowerCase().includes(s)
    );
    renderListes(filtered);
}

/* ================= BUDGET ================= */

function calculerBudget(data){
    let total=0;

    data.forEach(p=>{
        if(p.categorie==="MATERIEL" && p.etat==="HS"){
            total+=p.prix_unitaire||0;
        }
        if((p.categorie||"PIECE")==="PIECE" && p.quantite<=p.seuil_critique){
            total+=((p.seuil_critique||0)-(p.quantite||0))*(p.prix_unitaire||0);
        }
    });

    document.getElementById('total-budget').innerText=
        total.toLocaleString('fr-FR',{minimumFractionDigits:2})+" €";
}

/* ================= STATS ================= */

function renderStats(){
    const totalArticles=allProduits.length;
    const valeur=allProduits.reduce((s,p)=>s+((p.quantite||1)*(p.prix_unitaire||0)),0);

    document.getElementById('stats').innerHTML=`
        <div class="grid grid-cols-2 gap-4 text-center">
            <div class="bg-white p-4 shadow">
                Articles<br><b>${totalArticles}</b>
            </div>
            <div class="bg-white p-4 shadow">
                Valeur stock<br><b>${valeur.toFixed(2)} €</b>
            </div>
        </div>
    `;

    renderGraph();
}

function renderGraph(){
    const canvas=document.getElementById("graph");
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const max=Math.max(...allProduits.map(p=>p.quantite||1),1);

    allProduits.slice(0,10).forEach((p,i)=>{
        const h=((p.quantite||1)/max)*150;
        ctx.fillRect(i*70+40,180-h,40,h);
    });
}

/* ================= CSV ================= */

function exportCSV(){
    if(!allProduits.length) return alert("Aucune donnée");

    let csv="Nom;Code;Categorie;Quantite;Prix\n";
    allProduits.forEach(p=>{
        csv+=`${p.nom};${p.barcode||''};${p.categorie||''};${p.quantite||1};${p.prix_unitaire||0}\n`;
    });

    const blob=new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="stock_export.csv";
    a.click();
}

async function importCSV(e){
    const file=e.target.files[0];
    if(!file) return;
    const text=await file.text();
    const rows=text.split("\n").slice(1);

    for(const r of rows){
        const c=r.split(";");
        if(c.length<5) continue;
        await sb.from('produits').insert([{
            nom:c[0],
            barcode:c[1],
            categorie:c[2],
            quantite:parseInt(c[3])||0,
            prix_unitaire:parseFloat(c[4])||0
        }]);
    }

    alert("Import terminé");
    chargerDonnees();
}

/* ================= INIT ================= */

checkUser();
</script>

</body>
</html>
