<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMASI STOCK V2.7</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .tabs-content { display: none; }
        .tabs-content.active { display: block; }
        .low-stock { animation: pulse 1.5s infinite; border: 2px solid #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        label { font-size: 0.75rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-28 font-sans text-slate-900">
    <div id="app" class="max-w-xl mx-auto p-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-900 italic tracking-tighter">EMASI <span class="text-blue-500">PRO</span></h1>
            <button onclick="logout()" id="btn-logout" class="hidden text-[10px] bg-white px-3 py-2 rounded-xl shadow-sm text-slate-400 font-bold border border-slate-100">DÉCONNEXION</button>
        </div>

        <div id="login-section" class="bg-white p-8 rounded-[2.5rem] shadow-xl border mt-10">
            <h2 class="text-center font-black text-slate-300 mb-8 uppercase tracking-[0.2em] text-xs">Accès Équipe</h2>
            <div class="space-y-4">
                <input id="pseudo" type="text" placeholder="Identifiant" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 transition">
                <input id="password" type="password" placeholder="Code Secret" class="w-full border p-4 rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button onclick="login()" class="w-full bg-blue-600 text-white font-black p-5 rounded-2xl shadow-lg hover:bg-blue-700 transition uppercase tracking-widest mt-4">Entrer dans le stock</button>
            </div>
        </div>

        <div id="main-app" class="hidden space-y-4">
            
            <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.08)]">
                <button onclick="showTab('stock')" class="flex flex-col items-center p-2 tab-btn active text-blue-600 transition-all text-xl">📦<span class="text-[9px] font-black mt-1">STOCK</span></button>
                <button onclick="showTab('achats')" class="flex flex-col items-center p-2 tab-btn text-slate-300 transition-all text-xl">🛒<span class="text-[9px] font-black mt-1">ACHATS</span></button>
                <button onclick="showTab('logs')" class="flex flex-col items-center p-2 tab-btn text-slate-300 transition-all text-xl">📜<span class="text-[9px] font-black mt-1">LOGS</span></button>
            </nav>

            <div id="tab-stock" class="tabs-content active space-y-4">
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exporterExcel()" class="bg-emerald-600 text-white p-3 rounded-xl font-black text-[9px] uppercase shadow-md active:scale-95 transition-all">📊 Export Excel</button>
                    <label class="bg-amber-500 text-white p-3 rounded-xl font-black text-[9px] uppercase shadow-md active:scale-95 transition-all text-center cursor-pointer">
                        📥 Import (MAJ/AJOUT)
                        <input type="file" id="import-excel" class="hidden" accept=".xlsx, .xls">
                    </label>
                </div>

                <input id="search" oninput="chargerProduits()" type="text" placeholder="Rechercher..." class="w-full border p-5 rounded-[1.5rem] shadow-sm outline-none bg-white focus:ring-2 focus:ring-blue-400 transition-all">
                
                <button onclick="toggleForm()" class="w-full bg-blue-50 text-blue-700 p-5 rounded-[1.5rem] font-black text-sm uppercase italic border border-blue-100">+ Nouvel Article</button>
                
                <div id="form-container" class="hidden bg-white p-6 rounded-[2rem] border shadow-2xl space-y-4">
                    <input id="edit-id" type="hidden">
                    <div><label>Désignation</label><input id="nom" type="text" class="w-full border p-3 rounded-xl bg-slate-50"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label>Lieu</label><input id="emplacement" type="text" class="w-full border p-3 rounded-xl bg-slate-50"></div>
                        <div><label>Quantité</label><input id="qty" type="number" class="w-full border p-3 rounded-xl bg-slate-50"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label>Prix (€)</label><input id="prix" type="number" step="0.01" class="w-full border p-3 rounded-xl bg-slate-50"></div>
                        <div><label>Seuil Alerte</label><input id="seuil" type="number" class="w-full border p-3 rounded-xl bg-slate-50"></div>
                    </div>
                    <div>
                        <label>Photo</label>
                        <label class="flex flex-col items-center justify-center w-full bg-blue-50 border-2 border-dashed border-blue-200 p-6 rounded-2xl cursor-pointer">
                            <span class="text-2xl">📸</span>
                            <span class="text-[10px] font-black text-blue-600 uppercase mt-1">Prendre photo</span>
                            <input id="photo-file" type="file" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="ajouterOuModifier()" class="flex-1 bg-blue-600 text-white p-4 rounded-2xl font-black uppercase">Enregistrer</button>
                        <button onclick="toggleForm()" class="bg-slate-100 text-slate-500 px-4 rounded-2xl font-bold uppercase text-[10px]">Annuler</button>
                    </div>
                </div>
                <div id="liste-produits" class="grid gap-4"></div>
            </div>

            <div id="tab-achats" class="tabs-content space-y-4">
                <div class="bg-gradient-to-br from-blue-700 to-blue-900 p-8 rounded-[2.5rem] text-white shadow-xl">
                    <p class="text-[10px] uppercase font-black opacity-60">Budget Estimé</p>
                    <h2 id="total-budget" class="text-4xl font-black mt-1">0.00 €</h2>
                    <button onclick="envoyerRapportMail()" class="mt-6 w-full bg-white text-blue-800 py-3 rounded-xl text-[10px] font-black uppercase shadow-md">📧 Envoyer à Thierry</button>
                </div>
                <div id="liste-achats" class="grid gap-3"></div>
            </div>

            <div id="tab-logs" class="tabs-content space-y-4">
                <div id="liste-logs" class="bg-white rounded-[1.5rem] border shadow-sm divide-y"></div>
            </div>
        </div>
    </div>

    <script>
        const S_URL = "https://lluihawrhoajckrgvakv.supabase.co";
        const S_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P"; 
        const sb = supabase.createClient(S_URL, S_KEY);
        let userPseudo = "";

        // --- AUTH ---
        async function login() {
            const pseudo = document.getElementById('pseudo').value;
            const password = document.getElementById('password').value;
            const { data, error } = await sb.auth.signInWithPassword({ email: pseudo.toLowerCase() + "@emasi.stock", password });
            if (error) alert("Identifiant ou code incorrect"); else checkUser();
        }
        async function logout() { await sb.auth.signOut(); location.reload(); }
        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                userPseudo = user.email.split('@')[0].toUpperCase();
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                chargerProduits();
            }
        }

        // --- EXPORT / IMPORT EXCEL AVANCÉ ---
        async function exporterExcel() {
            const { data } = await sb.from('produits').select('nom, emplacement, quantite, prix_unitaire, seuil_critique').order('nom');
            const ws = XLSX.utils.json_to_sheet(data.map(p => ({
                "ARTICLE": p.nom,
                "Lieu": p.emplacement || "",
                "Stock": p.quantite,
                "Prix (€)": p.prix_unitaire,
                "Alerte": p.seuil_critique
            })));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stock");
            XLSX.writeFile(wb, `EXPORT_EMASI_${new Date().toLocaleDateString()}.xlsx`);
        }

        document.getElementById('import-excel').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const excelData = XLSX.utils.sheet_to_json(ws);
                
                if(!confirm(`Traiter ${excelData.length} lignes ? (Mise à jour et ajouts)`)) return;

                // Récupérer le stock actuel pour comparer
                const { data: currentDb } = await sb.from('produits').select('nom');
                const existingNoms = currentDb.map(p => p.nom);

                for (let row of excelData) {
                    const articleNom = row["ARTICLE"];
                    if(!articleNom) continue;

                    const payload = {
                        emplacement: row["Lieu"] || "",
                        quantite: row["Stock"] || 0,
                        prix_unitaire: row["Prix (€)"] || 0,
                        seuil_critique: row["Alerte"] || 0
                    };

                    if (existingNoms.includes(articleNom)) {
                        // MISE A JOUR
                        await sb.from('produits').update(payload).eq('nom', articleNom);
                    } else {
                        // NOUVEL AJOUT
                        await sb.from('produits').insert([{ nom: articleNom, ...payload }]);
                    }
                }
                alert("Base de données synchronisée !");
                chargerProduits();
            };
            reader.readAsBinaryString(e.target.files[0]);
        });

        // --- FONCTIONS STOCK ---
        async function chargerProduits() {
            const search = document.getElementById('search').value.toLowerCase();
            let { data } = await sb.from('produits').select('*').order('nom');
            if(search) data = data.filter(p => p.nom.toLowerCase().includes(search));
            const liste = document.getElementById('liste-produits');
            liste.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-[1.5rem] shadow-sm flex items-center gap-4 border ${p.quantite <= p.seuil_critique ? 'low-stock' : 'border-slate-100'}">
                    <img src="${p.image_url || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-xl object-cover bg-slate-50">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-black text-slate-800 text-[11px] uppercase truncate">${p.nom}</h3>
                            <button onclick="preparerEdition('${p.id}')" class="text-[8px] font-black text-blue-500 border border-blue-50 px-2 rounded">MAJ</button>
                        </div>
                        <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">📍 ${p.emplacement || '-'} | 💰 ${p.prix_unitaire || '0'}€</p>
                        <div class="flex items-center justify-between mt-2">
                            <div class="flex gap-2">
                                <button onclick="updateQty('${p.id}', ${p.quantite - 1}, '${p.nom}')" class="bg-slate-100 w-10 h-10 rounded-xl font-black shadow-inner">-</button>
                                <button onclick="updateQty('${p.id}', ${p.quantite + 1}, '${p.nom}')" class="bg-slate-100 w-10 h-10 rounded-xl font-black shadow-inner">+</button>
                            </div>
                            <span class="text-xl font-black ${p.quantite <= p.seuil_critique ? 'text-red-600' : 'text-slate-800'}">x${p.quantite}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function updateQty(id, newQty, nom) {
            if(newQty < 0) return;
            const { data: p } = await sb.from('produits').select('quantite').eq('id', id).single();
            const action = newQty > p.quantite ? "➕ AJOUT" : "➖ SORTIE";
            await sb.from('produits').update({ quantite: newQty }).eq('id', id);
            await sb.from('historique').insert([{ produit_nom: nom, utilisateur: userPseudo, action: action, quantite_finale: newQty }]);
            chargerProduits();
        }

        async function chargerLogs() {
            const { data } = await sb.from('historique').select('*').order('date_action', { ascending: false }).limit(40);
            const liste = document.getElementById('liste-logs');
            liste.innerHTML = data ? data.map(l => `<div class="p-4 flex justify-between items-center text-[10px] border-b"><div class="font-black uppercase">${l.produit_nom}<br><span class="text-blue-500">PAR: ${l.utilisateur}</span></div><div class="text-right font-black"><span class="${l.action.includes('AJOUT') ? 'text-green-600' : 'text-red-600'}">${l.action}</span><br><span class="text-slate-300 font-normal">${new Date(l.date_action).toLocaleTimeString()}</span></div></div>`).join('') : "";
        }

        async function ajouterOuModifier() {
            const id = document.getElementById('edit-id').value;
            const obj = { nom: document.getElementById('nom').value, emplacement: document.getElementById('emplacement').value, quantite: parseInt(document.getElementById('qty').value) || 0, prix_unitaire: parseFloat(document.getElementById('prix').value) || 0, seuil_critique: parseInt(document.getElementById('seuil').value) || 0 };
            const photoFile = document.getElementById('photo-file').files[0];
            if (photoFile) {
                const fileName = `${Date.now()}_${photoFile.name}`;
                await sb.storage.from('photos-stock').upload(fileName, photoFile);
                const { data: urlData } = sb.storage.from('photos-stock').getPublicUrl(fileName);
                obj.image_url = urlData.publicUrl;
            }
            if(id) await sb.from('produits').update(obj).eq('id', id);
            else await sb.from('produits').insert([obj]);
            toggleForm(); chargerProduits();
        }

        async function preparerEdition(id) {
            const { data } = await sb.from('produits').select('*').eq('id', id).single();
            document.getElementById('edit-id').value = data.id;
            document.getElementById('nom').value = data.nom;
            document.getElementById('emplacement').value = data.emplacement;
            document.getElementById('qty').value = data.quantite;
            document.getElementById('prix').value = data.prix_unitaire;
            document.getElementById('seuil').value = data.seuil_critique;
            toggleForm();
        }

        function showTab(tab) {
            document.querySelectorAll('.tabs-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.replace('text-blue-600', 'text-slate-300'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.currentTarget.classList.replace('text-slate-300', 'text-blue-600');
            if(tab === 'achats') calculerAchats();
            if(tab === 'logs') chargerLogs();
        }

        async function calculerAchats() {
            const { data } = await sb.from('produits').select('*');
            const alertes = data.filter(p => p.quantite <= p.seuil_critique);
            let total = 0;
            document.getElementById('liste-achats').innerHTML = alertes.map(p => {
                const manque = (p.seuil_critique + 5) - p.quantite;
                const cout = manque * p.prix_unitaire;
                total += cout;
                return `<div class="bg-white p-4 rounded-2xl border-l-4 border-red-500 flex justify-between items-center text-xs shadow-sm"><div class="font-black uppercase">${p.nom}</div><p class="font-black text-slate-800">${cout.toFixed(2)} €</p></div>`;
            }).join('');
            document.getElementById('total-budget').innerText = total.toFixed(2) + " €";
        }

        function toggleForm() { document.getElementById('form-container').classList.toggle('hidden'); if(document.getElementById('form-container').classList.contains('hidden')) resetForm(); }
        function resetForm() { document.querySelectorAll('#form-container input').forEach(i => i.value = ""); }
        function envoyerRapportMail() { window.location.href = `mailto:thierry.p057@gmail.com?subject=Alerte Stock EMASI&body=Budget réappro : ${document.getElementById('total-budget').innerText}.`; }
        checkUser();
    </script>
</body>
</html>
