<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMASI STOCK PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
.tabs-content{display:none}
.tabs-content.active{display:block}
.low-stock{border:3px solid #ef4444;background:#fef2f2}
.nav-active{color:#2563eb;border-top:3px solid #2563eb}
#reader{width:100%;min-height:250px;background:black;border-radius:20px}
</style>
</head>

<body class="bg-slate-50 pb-32">

<div class="max-w-xl mx-auto p-4">

<h1 class="text-xl font-black text-blue-900 mb-4">EMASI STOCK</h1>

<!-- ================= STOCK ================= -->

<div id="tab-pieces" class="tabs-content active">
<input id="search" oninput="chargerPieces()" placeholder="Rechercher..." class="w-full p-3 mb-4 rounded-xl border">

<button onclick="toggleScanner()" class="bg-slate-800 text-white p-3 rounded-xl w-full mb-4">📷 Scanner</button>

<div id="liste-pieces" class="grid gap-4"></div>
</div>

<!-- ================= MATERIEL ================= -->

<div id="tab-materiel" class="tabs-content">
<h2 class="font-bold mb-4">Matériel</h2>
<div id="liste-materiel" class="grid gap-4"></div>
</div>

<!-- ================= BUDGET ================= -->

<div id="tab-budget" class="tabs-content">
<h2 class="font-bold mb-4">Budget Prévisionnel</h2>

<div class="bg-white p-5 rounded-xl shadow mb-4">
<p>Total :</p>
<p id="budget-total" class="text-2xl font-black text-red-600">0 €</p>
</div>

<div id="budget-liste" class="grid gap-2"></div>
</div>

<!-- ================= HISTORIQUE ================= -->

<div id="tab-historique" class="tabs-content">
<h2 class="font-bold mb-4">Historique</h2>
<div id="liste-historique" class="grid gap-2"></div>
</div>

<!-- ================= ADMIN ================= -->

<div id="tab-admin" class="tabs-content">
<h2 class="font-bold mb-4">Admin</h2>

<div class="grid gap-3">

<button onclick="exportPieces()" class="bg-blue-100 p-3 rounded-xl">Export Pièces</button>
<button onclick="exportMateriel()" class="bg-blue-100 p-3 rounded-xl">Export Matériel</button>
<button onclick="exportBudget()" class="bg-emerald-100 p-3 rounded-xl">Export Budget</button>
<button onclick="exportBarcodes()" class="bg-purple-100 p-3 rounded-xl">Export Codes-barres</button>

<input type="file" id="import-file" class="hidden" onchange="importExcel(event)">
<button onclick="document.getElementById('import-file').click()" class="bg-yellow-100 p-3 rounded-xl">Import Excel</button>

</div>
</div>

<!-- ================= NAVIGATION ================= -->

<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2">

<button onclick="switchTab('pieces')" class="nav-active" id="nav-pieces">📦</button>
<button onclick="switchTab('materiel')" id="nav-materiel">🛠️</button>
<button onclick="switchTab('budget')" id="nav-budget">💰</button>
<button onclick="switchTab('historique')" id="nav-historique">🕒</button>
<button onclick="switchTab('admin')" id="nav-admin">⚙️</button>

</div>

<!-- ================= SCRIPT ================= -->

<script>

const SUPABASE_URL = "https://lluihawrhoajckrgvakv.supabase.co";
const SUPABASE_KEY = "sb_publishable_myjqiXhb_Iv1c2rOWzw3Kg_cTb8F86P";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function switchTab(name){
document.querySelectorAll('.tabs-content').forEach(t=>t.classList.remove('active'))
document.querySelectorAll('button').forEach(b=>b.classList.remove('nav-active'))
document.getElementById('tab-'+name).classList.add('active')
document.getElementById('nav-'+name).classList.add('nav-active')

if(name==="materiel") chargerMateriel()
if(name==="budget") chargerBudget()
if(name==="historique") chargerHistorique()
}

async function chargerPieces(){
const search=document.getElementById("search").value.toLowerCase()
const {data}=await sb.from("produits").select("*").eq("categorie","PIECE").order("nom")

if(!data)return

document.getElementById("liste-pieces").innerHTML=data
.filter(p=>p.nom.toLowerCase().includes(search))
.map(p=>`
<div class="bg-white p-4 rounded-xl shadow ${p.quantite<=p.seuil_critique?'low-stock':''}">
<b>${p.nom}</b>
<p>Stock: ${p.quantite}</p>
<button onclick="updateQty('${p.id}',1)">+</button>
<button onclick="updateQty('${p.id}',-1)">-</button>
</div>`).join("")
}

async function chargerMateriel(){
const {data}=await sb.from("produits").select("*").eq("categorie","MATERIEL")
if(!data)return

document.getElementById("liste-materiel").innerHTML=data.map(m=>`
<div class="bg-white p-4 rounded-xl shadow">
<b>${m.nom}</b>
<p>Etat: ${m.etat||"OK"}</p>
<p>Prix: ${m.prix_unitaire||0}€</p>
</div>`).join("")
}

async function chargerBudget(){
const {data}=await sb.from("produits").select("*")
if(!data)return

let total=0
let html=""

data.forEach(p=>{
if(p.categorie==="PIECE" && p.quantite<=p.seuil_critique){
let montant=(p.seuil_critique-p.quantite)*p.prix_unitaire
total+=montant
html+=`<div class="bg-white p-3 rounded-xl flex justify-between"><span>${p.nom}</span><span>${montant.toFixed(2)}€</span></div>`
}
if(p.categorie==="MATERIEL" && p.etat==="HS"){
total+=p.prix_unitaire
html+=`<div class="bg-white p-3 rounded-xl flex justify-between"><span>${p.nom}</span><span>${p.prix_unitaire}€</span></div>`
}
})

document.getElementById("budget-total").innerText=total.toNotice? total: total.toFixed(2)+" €"
document.getElementById("budget-liste").innerHTML=html
}

async function chargerHistorique(){
const {data}=await sb.from("historique").select("*").order("created_at",{ascending:false}).limit(30)
if(!data)return

document.getElementById("liste-historique").innerHTML=data.map(h=>`
<div class="bg-white p-3 rounded-xl shadow">
<b>${h.produit_nom}</b>
<p>${h.action||""}</p>
</div>`).join("")
}

async function updateQty(id,diff){
const {data:p}=await sb.from("produits").select("*").eq("id",id).single()
const newQty=Math.max(0,p.quantite+diff)

await sb.from("produits").update({quantite:newQty}).eq("id",id)
await sb.from("historique").insert([{produit_nom:p.nom,action:"MAJ STOCK"}])

chargerPieces()
}

function exportToExcel(data,name){
const ws=XLSX.utils.json_to_sheet(data)
const wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,name)
XLSX.writeFile(wb,name+".xlsx")
}

async function exportPieces(){
const {data}=await sb.from("produits").select("*").eq("categorie","PIECE")
exportToExcel(data,"Pieces")
}

async function exportMateriel(){
const {data}=await sb.from("produits").select("*").eq("categorie","MATERIEL")
exportToExcel(data,"Materiel")
}

async function exportBarcodes(){
const {data}=await sb.from("produits").select("nom,barcode")
exportToExcel(data,"Codes")
}

async function exportBudget(){
await chargerBudget()
alert("Export manuel budget possible depuis export général.")
}

function importExcel(event){
const file=event.target.files[0]
const reader=new FileReader()
reader.onload=async e=>{
const wb=XLSX.read(e.target.result,{type:"binary"})
const sheet=wb.Sheets[wb.SheetNames[0]]
const data=XLSX.utils.sheet_to_json(sheet)
for(const row of data){
await sb.from("produits").upsert(row)
}
chargerPieces()
}
reader.readAsBinaryString(file)
}

chargerPieces()

</script>

</body>
</html>
